name: daily_run
description: 每日跑步运动打卡 App，Flutter 双端
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  geolocator_android: ^5.2.1
  permission_handler: ^12.0.1
  sqflite: ^2.4.6
  path: ^1.9.1
  gal: ^3.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
