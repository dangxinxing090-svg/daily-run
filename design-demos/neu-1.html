}

/* 展示板全局 */
* { box-sizing: border-box; }

  color: var(--sand-12);
}
#root { width: 1600px; height: 1100px; position: relative; overflow: hidden; }
button { font-family: inherit; }

/* 凸起 / 内凹 / 可按压态：主按钮 :active 把 --raise 换成 --press，ease-out 250ms；hover 不弹跳缩放位移 */
.soft-raise { box-shadow: var(--raise); }
.soft-press { box-shadow: var(--press); }
.soft-btn { box-shadow: var(--raise); transition: box-shadow 250ms ease-out; cursor: pointer; }
.soft-btn:active { box-shadow: var(--press); }

@keyframes softModal {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

        <div style={androidFrameStyles.punchHole} />

        <div style={androidFrameStyles.content}>
          {children}
        </div>

        {navStyle === 'gesture' && (
          <div style={androidFrameStyles.navBar}>
            <div style={{
              ...androidFrameStyles.navButton,
              width: 100,
              height: 4,
              background: darkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)',
            }} />
          </div>
        )}

        {navStyle === 'buttons' && (
          <div style={androidFrameStyles.navBar}>
            <span style={{ color: textColor, fontSize: 20 }}>◁</span>
            <span style={{ color: textColor, fontSize: 16 }}>○</span>
            <span style={{ color: textColor, fontSize: 16 }}>□</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={softStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...softStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span className="soft-raise" style={softStyles.labelChip}>
          <span style={softStyles.boardNum}>{num}</span>
          <span style={softStyles.boardTxt}>{label}</span>
        </span>
      </div>
    </React.Fragment>
  );
}
