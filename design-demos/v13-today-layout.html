<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px; min-height: 1240px; padding: 42px 48px 40px;
    background: #f9f9f8; color: #1f211f;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.4px; }
  .sub { margin-top: 8px; font-size: 13px; color: #6f6a62; }
  .board { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }

  .col { background: #fdfdfc; border: .5px solid #dbd8d5; border-radius: 28px; padding: 18px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; }
  .no { font-size: 12px; font-weight: 600; color: #0d74ce; }
  .name { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .note { margin-top: 7px; font-size: 12px; color: #6f6a62; line-height: 1.6; min-height: 38px; }

  .phoneWrap { margin-top: 14px; display: flex; justify-content: center; }
  .phone {
    width: 416px; height: 832px; flex: 0 0 auto;
    border-radius: 34px; overflow: hidden;
    border: .5px solid #dbd8d5; background: #f9f9f8;
    box-shadow: 0 18px 40px rgba(31,33,31,.08);
    position: relative;
  }
  .screen {
    width: 320px; height: 640px; transform: scale(1.3); transform-origin: top left;
    background: #f9f9f8; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  .header { height: 28px; display: flex; align-items: baseline; justify-content: space-between; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: -.2px; }
  .meta { font-size: 12px; color: #6f6a62; }
  .card { background: #fdfdfc; border: .5px solid #dbd8d5; border-radius: 24px; }
  .goal { padding: 12px 14px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .label { font-size: 12px; color: #6f6a62; }
  .value { font-size: 20px; font-weight: 600; }
  .bar { height: 5px; margin-top: 10px; border-radius: 999px; background: #e9e8e6; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #0d74ce; }
  .bar.teal i { background: #008573; }
  .foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #6f6a62; }
  .foot b { font-weight: 600; color: #1f211f; }

  .statbar { display: flex; height: 64px; border-radius: 24px; overflow: hidden; }
  .stat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .stat + .stat { border-left: .5px solid #dbd8d5; }
  .stat .lb { font-size: 12px; color: #6f6a62; display: flex; align-items: center; gap: 3px; }
  .stat .vl { font-size: 20px; font-weight: 600; }

  .tabs {
    height: 52px; display: flex; margin: auto -16px -16px;
    background: #fdfdfc; border-top: .5px solid #dbd8d5;
  }
  .tab { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #6f6a62; }
  .tab.on { color: #0d74ce; font-weight: 600; }
  .tab.on::before { content: ''; position: absolute; width: 84px; height: 38px; left: 50%; top: 7px; transform: translateX(-50%); border-radius: 999px; background: #e6f4fe; z-index: -1; }

  .btn {
    width: 148px; height: 148px; border-radius: 50%; background: #0d74ce;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(13,116,206,.30), 0 0 0 20px rgba(13,116,206,.05);
  }
  .btn.lg { width: 168px; height: 168px; }
  .btn.sm { width: 126px; height: 126px; }

  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .plan { font-size: 12px; color: #6f6a62; }
  .plan b { color: #1f211f; font-weight: 600; }

  .actioncard { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(180deg, #fdfdfc 0%, #f3f8fd 100%); }
  .actionrow { display: flex; align-items: center; gap: 14px; }
  .actiontext { flex: 1; }
  .actiontext .big { font-size: 22px; font-weight: 600; letter-spacing: -.4px; }
  .actiontext .small { margin-top: 6px; font-size: 12px; color: #6f6a62; }
  .actioncard .bar { margin-top: 0; }

  .bigstat { padding: 16px; }
  .bigstat .num { font-size: 48px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; }
  .bigstat .unit { font-size: 14px; color: #6f6a62; margin-left: 4px; }
  .bigstat .row2 { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; }
  .bigstat .bar { margin-top: 14px; }
  .bigstat .foot { margin-top: 8px; }

  .iconArea { margin-top: 14px; padding-top: 14px; border-top: .5px solid #dbd8d5; display: flex; align-items: center; gap: 14px; }
  .appIcon { width: 68px; height: 68px; border-radius: 18px; background: #0d74ce; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; box-shadow: 0 6px 16px rgba(13,116,206,.22); }
  .key { font-size: 12px; line-height: 1.7; }
  .key .k { font-weight: 600; }
  .key .muted { color: #6f6a62; }
</style>
</head>
<body>
<h1>今日页重排　三个方向</h1>
<p class="sub">同一套信息：开跑、今日目标、三格数据、底部导航。每个方向配一套跑者图标，选中后同一图标直接用于开跑按钮和 App 桌面图标。</p>
<div class="board" id="board"></div>

<script>
const icons = {
  a: `<svg viewBox="0 0 44 44" width="92" height="92" fill="none" stroke="#fdfdfc" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="8.5" r="4.3" fill="#fdfdfc" stroke="none"/>
    <path d="M25.5 13.5 L19.5 25"/>
    <path d="M19.5 25 L27.5 29 L26 38"/>
    <path d="M19.5 25 L12 28.8 L5.5 26.5"/>
    <path d="M23.8 16.2 L31.2 18.4 L34.2 12.4"/>
    <path d="M22.8 17.2 L14.5 20 L11.5 26.4"/>
  </svg>`,
  b: `<svg viewBox="0 0 44 44" width="92" height="92" fill="none" stroke="#fdfdfc" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="31" cy="8" r="5" fill="#fdfdfc" stroke="none"/>
    <path d="M27.5 13 L18 23"/>
    <path d="M18 23 L30 24.5 L36 33"/>
    <path d="M18 23 L10.5 31 L4 34"/>
    <path d="M25.5 16.5 L34 12 L38 6.5"/>
    <path d="M24 18 L14 16 L9.5 22.5"/>
  </svg>`,
  c: `<svg viewBox="0 0 44 44" width="92" height="92" fill="none" stroke="#fdfdfc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 38 C13 38 13 26 21 25 C29 24 28 14 35 12" stroke-width="4.4"/>
    <circle cx="35" cy="8" r="4.2" fill="#fdfdfc" stroke="none"/>
    <path d="M21 25 L14 19" stroke-width="3.7"/>
    <path d="M21 25 L15 34" stroke-width="3.7"/>
    <circle cx="4" cy="38" r="2.5" fill="#fdfdfc" stroke="none" opacity=".75"/>
  </svg>`,
};

const tab = (on) => `
  <div class="tab ${on ? 'on' : ''}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    今日
  </div>
  <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8 16.5c4-1 1-6 5-7s2.5 3 5-1"/></svg>跑中</div>
  <div class="tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10"/></svg>记录</div>`;

const statbar = `
  <div class="statbar card">
    <div class="stat"><div class="lb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0d74ce" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>连续</div><div class="vl">0 天</div></div>
    <div class="stat"><div class="lb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#008573" stroke-width="1.8"><path d="M4 8h16M4 12h16M4 16h10"/></svg>本月</div><div class="vl">0.0 km</div></div>
    <div class="stat"><div class="lb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#008573" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>打卡</div><div class="vl">0 次</div></div>
  </div>`;

const goalCard = `
  <div class="goal card">
    <div class="row"><div class="label">今日目标</div><div class="value">3.00 km <span style="font-size:13px;color:#6f6a62">✎</span></div></div>
    <div class="bar"><i style="width:40%"></i></div>
    <div class="foot"><span>今日已跑</span><b>1.20 km</b></div>
  </div>`;

const iconFoot = (key, lines) => `
  <div class="iconArea">
    <div class="appIcon">${icons[key]}</div>
    <div class="key">
      <div class="k">同一枚图标，两处使用</div>
      <div class="muted">${lines.join('<br>')}</div>
    </div>
  </div>`;

const screens = {
  a: `
    <div class="screen">
      <div class="header"><div class="title">今日</div><div class="meta">11月27日 周五</div></div>
      ${goalCard}
      <div class="hero">
        <div class="plan">轻松跑 <b>19:30</b></div>
        <div class="btn">${icons.a}</div>
        <div class="plan">点一下开始</div>
      </div>
      ${statbar}
      <div class="tabs">${tab(true)}</div>
    </div>`,
  b: `
    <div class="screen">
      <div class="header"><div class="title">今日</div><div class="meta">11月27日 周五</div></div>
      <div class="actioncard card">
        <div class="actionrow">
          <div class="btn sm">${icons.b}</div>
          <div class="actiontext">
            <div class="big">轻松跑</div>
            <div class="small">今天 19:30</div>
            <div class="small">目标 3.00 km</div>
          </div>
        </div>
        <div>
          <div class="row"><div class="label">今日已跑</div><div class="value">1.20 km</div></div>
          <div class="bar teal" style="margin-top:10px"><i style="width:40%"></i></div>
        </div>
      </div>
      ${statbar}
      <div class="goal card" style="padding:12px 14px">
        <div class="row"><div class="label">今日目标</div><div class="value">3.00 km ✎</div></div>
      </div>
      <div class="tabs">${tab(true)}</div>
    </div>`,
  c: `
    <div class="screen">
      <div class="header"><div class="title">今日</div><div class="meta">11月27日 周五</div></div>
      <div class="bigstat card">
        <div class="row2">
          <div><span class="num">1.20</span><span class="unit">km</span></div>
          <div class="label">目标 3.00 km ✎</div>
        </div>
        <div class="bar"><i style="width:40%"></i></div>
        <div class="foot"><span>今日已跑</span><b>轻松跑 19:30</b></div>
      </div>
      <div class="hero" style="gap:16px">
        <div class="btn lg">${icons.c}</div>
        <div class="plan">准备好了就开始</div>
      </div>
      ${statbar}
      <div class="tabs">${tab(true)}</div>
    </div>`
};

const items = [
  { key: 'a', no: '01', name: '目标在上', note: '先看到目标与进度，按钮落在画面正中。信息最稳，主次最清楚。', iconLines: ['头小、四肢舒展，强调速度感', '线条较细，小尺寸仍可辨'] },
  { key: 'b', no: '02', name: '动作在左', note: '开跑与计划合成一张横向卡，右侧写清计划和目标，空间利用最充分。', iconLines: ['前倾更明显，手臂上扬，像冲线', '笔画更粗，小图标最有力量'] },
  { key: 'c', no: '03', name: '数据在上', note: '把今日里程做成主视觉，目标、计划、开跑依次向下，空间分配最有节奏。', iconLines: ['跑者后面带一小段轨迹与起点', '与「记录轨迹」的产品语义最贴'] },
];

document.getElementById('board').innerHTML = items.map(i => `
  <div class="col">
    <div class="head"><div class="no">${i.no}</div><div class="name">${i.name}</div></div>
    <div class="note">${i.note}</div>
    <div class="phoneWrap"><div class="phone">${screens[i.key]}</div></div>
    ${iconFoot(i.key, i.iconLines)}
  </div>`).join('');
</script>
</body>
</html>
