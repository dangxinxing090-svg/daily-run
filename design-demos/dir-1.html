/* ============================================================
   程序化图形：抽象街区线框 + 粗轨迹带 + 配速条
   ============================================================ */

function TrackBand({ color = 'var(--orange-1)', height = 110, width = 7, opacity = 1, dot = true, bottom = 0 }) {
  return (
    <svg viewBox="0 0 480 110" preserveAspectRatio="none" style={{
      position: 'absolute', left: -10, bottom, width: 'calc(100% + 20px)',
      height, color, opacity, pointerEvents: 'none',
    }}>
      <path d="M-10 80 C50 72 88 54 140 58 S208 88 266 70 S338 46 400 56 S452 78 490 64"
        style={{
          fill: 'none', stroke: 'currentColor', strokeWidth: width,
          strokeLinecap: 'round', strokeLinejoin: 'round',
          vectorEffect: 'non-scaling-stroke',
        }} />
      {dot && <circle cx="400" cy="56" r={width} style={{ fill: 'currentColor' }} />}
    </svg>
  );
}

function StreetMap({ w = '100%', h = 150, grid = 'var(--slate-6)', track = 'var(--orange-9)', lw = 5 }) {
  return (
    <svg viewBox="0 0 240 160" preserveAspectRatio="none" style={{ width: w, height: h, display: 'block' }}>
      <g style={{ stroke: grid, strokeWidth: 0.5, fill: 'none', opacity: 0.65 }}>
        <path d="M0 34 H240 M0 86 H240 M0 132 H240 M46 0 V160 M112 0 V160 M180 0 V160" />
        <path d="M0 0 L240 160 M240 0 L0 160" style={{ opacity: 0.4 }} />
      </g>
      <path d="M22 132 C60 120 74 56 120 62 S172 128 208 92"
        style={{ fill: 'none', stroke: track, strokeWidth: lw, strokeLinecap: 'round' }} />
      <circle cx="22" cy="132" r={lw} style={{ fill: track }} />
      <circle cx="208" cy="92" r={lw + 1} style={{ fill: track }} />
    </svg>
  );
}

function PaceBars({ color = 'var(--orange-9)', h = 36, dark = false }) {
  const vals = [0.52, 0.68, 0.6, 0.86, 0.72, 0.9, 0.66];
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 5, height: h }}>
      {vals.map((v, i) => (
        <div key={i} style={{
          flex: 1, height: Math.round(v * h), borderRadius: 4,
          background: color, opacity: dark ? 0.92 : 1,
        }} />
      ))}
    </div>
  );
}

/* ============================================================
   通用组件：TabBar / Modal / 开关
   ============================================================ */

function TabBar({ current, onTab, running }) {
  return (
    <div data-act="tabbar" style={{
      ...velocityStyles.tabbar,
      ...(running ? velocityStyles.tabbarRunning : {}),
    }}>
      {TABS.map(t => {
        const on = current === t.key;
        return (
          <button key={t.key} data-tab={t.key} onClick={() => onTab(t.key)}
            style={{
              ...velocityStyles.tabItem,
              fontWeight: on ? 600 : 400,
              color: running
                ? (on ? 'var(--orange-1)' : 'var(--oranged-11)')
                : (on ? 'var(--orange-11)' : 'var(--slate-11)'),
            }}>
            <span style={{
              width: on ? 18 : 0, height: 2, borderRadius: 999,
              background: running ? 'var(--orange-9)' : 'var(--orange-9)',
            }} />
            {t.label}
          </button>
        );
      })}
    </div>
  );
}

function VeloModal({ title, onClose, children, dark }) {
  return (
    <div data-act="modal-overlay" onClick={onClose}
      style={{ position: 'absolute', inset: 0, zIndex: 40 }}>
      <div style={{ position: 'absolute', inset: 0, background: 'var(--oranged-1)', opacity: 0.55 }} />
      <div style={{
        position: 'relative', height: '100%', display: 'flex', alignItems: 'center',
        justifyContent: 'center', padding: 16, pointerEvents: 'none',
      }}>
        <div data-act="modal" onClick={e => e.stopPropagation()} style={{
          width: '86%', maxHeight: '88%', overflow: 'auto', pointerEvents: 'auto',
          background: dark ? 'var(--oranged-2)' : 'var(--orange-1)',
          borderRadius: 12, padding: 14,
          border: dark ? '0.5px solid var(--oranged-7)' : '0.5px solid var(--slate-6)',
          boxShadow: '0 18px 48px color-mix(in srgb, var(--oranged-1) 38%, transparent)',
          animation: 'veloModal 250ms ease-out',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: dark ? 'var(--oranged-12)' : 'var(--slate-12)' }}>{title}</span>
            <button onClick={onClose} style={{
              fontSize: 12, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer',

  );

        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: 58, marginTop: 12, borderBottom: '0.5px solid var(--slate-6)' }}>
          {trend.map((v, i) => (
            <div key={i} style={{ flex: 1, height: Math.round(v * 52), background: 'var(--orange-9)', borderRadius: 4 }} />
          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
          <span style={velocityStyles.txt12}>10月31日</span>
          <span style={velocityStyles.txt12}>11月6日</span>
        </div>
      </div>

      {[RUN.rec1, RUN.rec2].map((r, i) => (
        <div key={i} data-act={'rec' + i} onClick={() => open('rec' + i)}
          style={{
            ...velocityStyles.cutBlock, clipPath: i % 2 === 0 ? CUT.trap2 : CUT.trap,
            background: 'var(--orange-3)', border: '0.5px solid var(--orange-6)',
            padding: '11px 20px', cursor: 'pointer',
          }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--slate-12)' }}>{r.date}</span>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--orange-11)', fontVariantNumeric: 'tabular-nums' }}>{r.dist}</span>
          </div>
          <div style={{ ...velocityStyles.txt12, marginTop: 5 }}>
            {r.time}，平均配速 {r.pace}
          </div>
        </div>

  );
}

/* ============================================================
   3:4 记录图分享卡
   ============================================================ */

function ShareCard() {

        <span style={{ fontSize: 14, fontWeight: 600 }}>每日跑步</span>
        <span style={{ fontSize: 12, fontWeight: 400, color: 'var(--oranged-11)' }}>{RUN.date}</span>
      </div>

      <div style={{ flex: 1, margin: '14px 0', overflow: 'hidden', borderRadius: 8 }}>
        <StreetMap w="100%" h="100%" grid="var(--oranged-7)" track="var(--orange-9)" lw={5} />
      </div>

      <div style={{ fontSize: 24, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{RUN.finishDist}</div>
      <div style={{ display: 'flex', gap: 16, marginTop: 6, alignItems: 'baseline' }}>

        <span style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{RUN.finishPace}</span>

      <div style={{
        fontSize: 12, fontWeight: 500, color: 'var(--orange-9)', marginTop: 12,

        自动打卡成功，连续 {RUN.streak}
      </div>

}

/* ============================================================
   Modal 内容分发
   ============================================================ */

function ModalBody({ kind, onClose, reminder }) {
  if (kind === 'shareCard') {
    return (
      <VeloModal title="记录图 3:4" onClose={onClose} dark>
        <ShareCard />
        <div style={{ fontSize: 12, fontWeight: 400, color: 'var(--oranged-11)', marginTop: 10, textAlign: 'center' }}>
          含轨迹，距离，时间，配速
        </div>
      </VeloModal>
    );
  }
  if (kind === 'planDetail') {
    return (
      <VeloModal title="今日计划" onClose={onClose}>
        <div style={{ ...velocityStyles.heroBand, clipPath: CUT.trap, borderRadius: 8, paddingBottom: 26 }}>
          <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--slate-12)' }}>{RUN.date}</div>
          <div style={{ fontSize: 24, fontWeight: 600, color: 'var(--orange-1)', marginTop: 6 }}>
            {RUN.planTime} {RUN.planType}
          </div>
        </div>
        {[
          { k: '类型', v: RUN.planType },
          { k: '目标', v: RUN.target },
          { k: '提醒', v: RUN.remind },
          { k: '状态', v: '已写进日历' },
        ].map(r => (
          <div key={r.k} style={velocityStyles.rowLine}>
            <span style={velocityStyles.txt12}>{r.k}</span>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--slate-12)' }}>{r.v}</span>
          </div>
        ))}
        <div style={{ ...velocityStyles.txt12, marginTop: 12, lineHeight: 1.7 }}>跑完自动写入当天完成</div>
      </VeloModal>
    );
  }
  if (kind === 'saved') {
    return (
      <VeloModal title="已写入日历" onClose={onClose}>
        <div style={{ fontSize: 24, fontWeight: 600, color: 'var(--slate-12)' }}>{RUN.planTime} {RUN.planType}</div>
        <div style={{ ...velocityStyles.txt12, marginTop: 10, lineHeight: 1.7 }}>
          {RUN.date}，目标 {RUN.target}，提醒 {RUN.remind} {reminder ? '已开启' : '已关闭'}
        </div>
        <div style={{ marginTop: 14, ...velocityStyles.cutBlock, clipPath: CUT.trap, background: 'var(--orange-3)' }}>
          <span style={velocityStyles.txt12}>日历上已可见这次安排</span>
        </div>
      </VeloModal>
    );
  }
  if (kind === 'field') {
    return (
      <VeloModal title="计划事项" onClose={onClose}>
        {[
          { k: '日期', v: RUN.date },
          { k: '时间', v: RUN.planTime },
          { k: '类型', v: RUN.planType },
          { k: '目标', v: RUN.target },
        ].map(r => (
          <div key={r.k} style={velocityStyles.rowLine}>
            <span style={velocityStyles.txt12}>{r.k}</span>
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--slate-12)' }}>{r.v}</span>
          </div>
        ))}
      </VeloModal>
    );
  }
  if (kind === 'rec0' || kind === 'rec1') {
    const r = kind === 'rec0' ? RUN.rec1 : RUN.rec2;
    return (
      <VeloModal title="单次记录" onClose={onClose}>
        <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--slate-12)' }}>{r.date}</div>
        <div style={{ fontSize: 24, fontWeight: 600, color: 'var(--orange-11)', fontVariantNumeric: 'tabular-nums', marginTop: 4 }}>{r.dist}</div>
        <div style={{ borderRadius: 8, overflow: 'hidden', marginTop: 12, background: 'var(--orange-3)' }}>
          <StreetMap w="100%" h={120} grid="var(--slate-6)" track="var(--orange-9)" lw={4} />
        </div>
        <div style={{ display: 'flex', gap: 18, marginTop: 12 }}>
          <span style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{r.time}</span>
          <span style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{r.pace}</span>
        </div>
        <div style={{ ...velocityStyles.txt12, marginTop: 12 }}>分段配速</div>
        <div style={{ marginTop: 8 }}><PaceBars h={34} /></div>
      </VeloModal>
    );
  }
  return null;
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={velocityStyles.screenRoot}>
            {screenEl}
            {screen !== 'running' && <TabBar current={screen} onTab={go} running={false} />}
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...velocityStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={velocityStyles.boardNum}>{num}</span>
        <span style={velocityStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}

</script>
