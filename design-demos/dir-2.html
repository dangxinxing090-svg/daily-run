/* =========================================================
   程序化图形：双环 / 轨迹 / 月历 / 趋势 / 记录图
   ========================================================= */
function DoubleRing({ outer = 1, inner = 1, size = 76 }) {
  const R1 = 30, R2 = 19;
  const c1 = 2 * Math.PI * R1, c2 = 2 * Math.PI * R2;
  return (
    <svg width={size} height={size} viewBox="0 0 76 76" style={{ flex: '0 0 auto', display: 'block' }}>
      <circle cx="38" cy="38" r={R1} className="g-ring-base" strokeWidth="8" />
      <circle cx="38" cy="38" r={R1} className="g-ring-outer" strokeWidth="8" strokeLinecap="round"
        strokeDasharray={c1} strokeDashoffset={c1 * (1 - Math.min(outer, 1))} transform="rotate(-90 38 38)" />
      <circle cx="38" cy="38" r={R2} className="g-ring-base" strokeWidth="5" />
      <circle cx="38" cy="38" r={R2} className="g-ring-inner" strokeWidth="5" strokeLinecap="round"
        strokeDasharray={c2} strokeDashoffset={c2 * (1 - Math.min(inner, 1))} transform="rotate(-90 38 38)" />
    </svg>
  );
}

function TrackSvg({ height = 150, soft = false, compact = false }) {
  const track = soft ? 'g-track-soft' : 'g-track';
  const sw = soft ? 2 : (compact ? 2 : 3);
  return (
    <svg viewBox="0 0 340 150" preserveAspectRatio="none"
      style={{ width: '100%', height, display: 'block', borderRadius: 8 }}>
      <rect x="0" y="0" width="340" height="150" className="g-block" opacity="0.45" />
      <g className="g-street" strokeWidth="0.5" opacity="0.8">
        <path d="M0 34 H340 M0 82 H340 M0 126 H340 M52 0 V150 M128 0 V150 M210 0 V150 M286 0 V150" />
        <path d="M52 34 L128 82 M210 34 L286 126 M128 82 L210 34" opacity="0.4" />
      </g>
      <g className="g-block">
        <rect x="60" y="41" width="58" height="33" rx="5" />
        <rect x="138" y="90" width="62" height="28" rx="5" />
        <rect x="218" y="41" width="58" height="33" rx="5" />
        <rect x="294" y="90" width="38" height="28" rx="5" />
      </g>
      <path d="M28 122 C70 112 88 58 138 62 S204 120 250 96 S306 40 322 56"
        className={track} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx="28" cy="122" r={compact ? 3 : 4} className="g-dot-start" />
      <circle cx="322" cy="56" r={compact ? 3.5 : 5} className="g-dot-end" strokeWidth="2" />
    </svg>
  );
}

/* 周历条：柔和色编码，休息日也是一种完成 */
function WeekStrip() {
  const days = [
    { d: '2', w: '一', s: 'rest' },
    { d: '3', w: '二', s: 'done' },
    { d: '4', w: '三', s: 'rest' },
    { d: '5', w: '四', s: 'light' },
    { d: '6', w: '五', s: 'today' },
    { d: '7', w: '六', s: 'rest' },
    { d: '8', w: '日', s: 'rest' },
  ];
  const bg = { rest: 'var(--grass-3)', light: 'var(--grass-5)', done: 'var(--grass-9)', today: 'var(--grass-9)' };
  const fg = { rest: 'var(--grass-11)', light: 'var(--grass-12)', done: 'var(--slate-1)', today: 'var(--slate-1)' };
  return (
    <div style={gentleStyles.weekRow}>
      {days.map((x) => (
        <div key={x.d} className="g-num" style={{
          ...gentleStyles.weekCell,
          background: bg[x.s],
          border: x.s === 'today' ? '0.5px solid var(--grass-12)' : '0.5px solid transparent',
        }}>
          <span style={{ ...gentleStyles.weekNum, color: fg[x.s] }}>{x.d}</span>
          <span style={{ ...gentleStyles.weekDay, color: fg[x.s], opacity: 0.9 }}>{x.w}</span>
        </div>
      ))}
    </div>
  );
}

/* 月历 */
function MonthGrid() {
  const cells = [];
  for (let i = 0; i < 6; i++) cells.push(null); // 第一周周日之前留空
  for (let d = 1; d <= 30; d++) cells.push(d);
  while (cells.length < 42) cells.push(null);
  const done = { 1: 1, 3: 1, 5: 1, 6: 1 };
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2 }}>
      {cells.map((d, i) => {
        if (d === null) return <div key={i} style={{ height: 18 }} />;
        const isToday = d === 6, isDone = !!done[d];
        return (
          <div key={i} className="g-num" style={{
            height: 18, display: 'grid', placeItems: 'center',
            borderRadius: 4,
            background: isToday ? 'var(--grass-9)' : (isDone ? 'var(--grass-5)' : 'var(--grass-3)'),
            fontSize: 12, fontWeight: isToday || isDone ? 600 : 400,
            color: isToday ? 'var(--slate-1)' : 'var(--grass-11)',
          }}>{d}</div>
        );
      })}
    </div>
  );
}

/* 里程趋势：8 次打卡 */
function TrendBars() {
  const vals = [4.2, 5.0, 6.3, 4.8, 5.2, 5.0, 6.0, 5.21];
  const max = 6.5;
  return (
    <svg viewBox="0 0 300 58" preserveAspectRatio="none" style={{ width: '100%', height: 58, display: 'block' }}>
      {vals.map((v, i) => {
        const h = (v / max) * 52;
        return <rect key={i} x={8 + i * 36} y={56 - h} width="22" height={h} rx="3"
          className={i === 2 ? 'g-bar-hi' : 'g-bar'} />;
      })}
    </svg>
  );
}

          <DataCell label="已用时间" value={gentleData.running.elapsed} />
          <DataCell label="距离" value={gentleData.running.dist} />
          <DataCell label="当前配速" value={gentleData.running.pace} />
        </div>
        <div className="g-num" style={{ fontSize: 12, fontWeight: 400, color: 'var(--grass-11)', marginTop: 10 }}>
          平均配速 {gentleData.running.avgPace}　心率 {gentleData.running.hr}
        </div>
      </div>
    );
  }
  if (type === 'share') {
    return (
      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <ShareCard width={228} />
      </div>
    );
  }
  if (type === 'record') {
    const r = gentleData.history[payload || 0];
    return (
      <div>
        <div style={{ borderRadius: 8, overflow: 'hidden' }}><TrackSvg height={120} soft /></div>
        <div className="g-num" style={{ fontSize: 20, fontWeight: 600, color: 'var(--grass-12)', marginTop: 12 }}>{r.dist}</div>
        <div className="g-num" style={{ fontSize: 12, fontWeight: 400, color: 'var(--grass-11)', marginTop: 5 }}>
          {r.date}　{r.time}　平均配速 {r.pace}
        </div>
      </div>
    );
  }
  return null;
}

/* =========================================================
   AppPhone   每台独立状态机
   ========================================================= */
function AppPhone({ initial }) {
  const [screen, setScreen] = useState(initial);
  const [modal, setModal] = useState(null);
  const [remind, setRemind] = useState(true);
  const [paused, setPaused] = useState(false);
  const [planType, setPlanType] = useState('轻松跑');
  const close = () => setModal(null);
  const openModal = (type, payload) => setModal({ type, payload });
  const ctx = { remind, setRemind, paused, setPaused, planType, setPlanType, goFinish: () => setScreen('finish') };

  return (
    <div style={{ position: 'relative', height: '100%' }}>
      {screen === 'today' && <TodayScreen screen={screen} onTab={setScreen} openModal={openModal} />}
      {screen === 'plan' && <PlanScreen screen={screen} onTab={setScreen} openModal={openModal} ctx={ctx} />}
      {screen === 'running' && <RunningScreen screen={screen} onTab={setScreen} openModal={openModal} ctx={ctx} />}
      {screen === 'finish' && <FinishScreen screen={screen} onTab={setScreen} openModal={openModal} />}
      {screen === 'history' && <HistoryScreen screen={screen} onTab={setScreen} openModal={openModal} />}
      {modal && (
        <Modal title={{
          planDetail: '计划详情', type: '选择类型', saved: '已写进日历',
          track: '跑中轨迹', share: '记录图 3:4', record: '单次记录',
        }[modal.type]} onClose={close} width={modal.type === 'share' ? 260 : 280}>
          <ModalBody type={modal.type} payload={modal.payload} close={close} ctx={ctx} />
        </Modal>
      )}
    </div>
  );
}

/* =========================================================
   展示板   流程串联（计划 → 提醒 → 跑中 → 自动打卡 → 回顾）
   ========================================================= */
const SCALE = 0.68;
const FRAME = { ios: { w: 417, h: 876 }, android: { w: 432, h: 912 } };
const gentlePhones = [
  { no: '01', label: '计划', frame: 'ios', left: 12, top: 138, initial: 'plan' },
  { no: '02', label: '今日', frame: 'ios', left: 328, top: 206, initial: 'today' },
  { no: '03', label: '跑中', frame: 'android', left: 644, top: 274, initial: 'running' },
  { no: '04', label: '完成', frame: 'ios', left: 960, top: 342, initial: 'finish' },
  { no: '05', label: '记录', frame: 'android', left: 1276, top: 410, initial: 'history' },
].map((p) => ({ ...p, vw: FRAME[p.frame].w * SCALE, vh: FRAME[p.frame].h * SCALE }));

const gentleLinks = [
  { text: '设提醒' },
  { text: '开跑' },
  { text: '自动打卡' },
  { text: '看记录' },
];

function FlowLines() {
  return (
    <svg width="1600" height="1100" viewBox="0 0 1600 1100"
      style={{ position: 'absolute', left: 0, top: 0, zIndex: 1, pointerEvents: 'none' }}>
      {gentleLinks.map((ln, i) => {
        const A = gentlePhones[i], B = gentlePhones[i + 1];
        const x1 = A.left + A.vw, y1 = A.top + A.vh / 2;   // 上一屏右缘：从这里点出去
        const x2 = B.left;                                  // 下一屏左缘
        const yTop = B.top - 34;                            // 两台之间的凹口水平线
        const p1x = x1 + 14, p2x = x2 + 72;
        const lw = 12 * ln.text.length + 22;
        const lx = (p1x + p2x) / 2 - lw / 2, ly = yTop - 28;
        return (
          <g key={i}>
            {/* 0.5px 细线：从上一屏右缘斜上，横穿凹口，再折下接入下一屏 */}
            <path d={`M${x1} ${y1} L${p1x} ${yTop} L${p2x} ${yTop} L${p2x} ${B.top + 8}`}
              className="g-line" strokeWidth="0.5" />
            <circle cx={x1} cy={y1} r="2.5" className="g-arrow" />
            <path d={`M${p2x - 11} ${yTop - 3} L${p2x - 5} ${yTop} L${p2x - 11} ${yTop + 3} Z`}
              className="g-arrow" />
            {/* 12px 标注胶囊，紧贴水平线上方，落在凹口空白 */}
            <rect x={lx} y={ly} width={lw} height="22" rx="11" className="g-label-bg" strokeWidth="0.5" />
            <text x={lx + lw / 2} y={ly + 15} textAnchor="middle"
              className="g-label-tx" style={{ fontSize: 12, fontWeight: 600 }}>{ln.text}</text>
          </g>
        );
      })}
    </svg>
  );
}

function PhoneNode({ p }) {
  const F = FRAME[p.frame];
  const Frame = p.frame === 'ios' ? IosFrame : AndroidFrame;
  return (
    <div data-phone={p.no} style={{ position: 'absolute', left: p.left, top: p.top, width: p.vw, height: p.vh, zIndex: 2 }}>
      <div style={{ position: 'absolute', left: 0, top: -26, display: 'flex', alignItems: 'baseline', gap: 8 }}>
        <span className="g-num" style={{ fontSize: 12, fontWeight: 600, color: 'var(--grass-9)' }}>{p.no}</span>
        <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--grass-12)' }}>{p.label}</span>
      </div>
      <div style={{
        position: 'absolute', left: 0, top: 0, width: F.w, height: F.h,
        transform: `scale(${SCALE})`, transformOrigin: 'top left',
      }}>
        <Frame time="19:30" battery={86}>
          <AppPhone initial={p.initial} />
        </Frame>
      </div>
    </div>
  );
}

function Board() {
  return (
    <div style={{ position: 'relative', width: 1600, height: 1100, background: 'var(--grass-2)' }}>
      {/* 标题区 */}
      <div style={{ position: 'absolute', left: 34, top: 26, right: 34, height: 84,
        display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between',
        borderBottom: '0.5px solid var(--grass-6)', zIndex: 3 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: 'var(--grass-12)', letterSpacing: '-0.01em' }}>每日跑步</div>
          <div style={{ fontSize: 12, fontWeight: 400, color: 'var(--grass-11)', marginTop: 7 }}>
            把计划，提醒，跑步和打卡串成一圈
          </div>
          <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--grass-11)', marginTop: 6 }}>
            方向 03　温柔打卡　iOS + Android
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingTop: 4 }}>
          {gentlePhones.map((p) => (
            <div key={p.no} className="g-num" style={{
              display: 'flex', alignItems: 'center', gap: 7,
              background: 'var(--slate-1)', border: '0.5px solid var(--grass-5)',
              borderRadius: 999, padding: '6px 12px',
            }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--grass-9)' }}>{p.no}</span>
              <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--grass-12)' }}>{p.label}</span>
            </div>
          ))}
        </div>
      </div>

      <FlowLines />

      {gentlePhones.map((p) => <PhoneNode key={p.no} p={p} />)}

      {/* 底部语境注脚 */}
      <div className="g-num" style={{ position: 'absolute', left: 34, bottom: 22, zIndex: 3,
        fontSize: 12, fontWeight: 400, color: 'var(--grass-11)' }}>
        2026-11-06 周五　连续 13 天　本月 42.6 km　8 次打卡
      </div>
      <div style={{ position: 'absolute', right: 34, bottom: 22, zIndex: 3,
        fontSize: 12, fontWeight: 500, color: 'var(--grass-11)' }}>
        计划　今日　跑中　完成　记录
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
</body>
</html>
