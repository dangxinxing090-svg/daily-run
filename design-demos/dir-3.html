function PT(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, s, e) {
  const [x1, y1] = PT(cx, cy, r, s);
  const [x2, y2] = PT(cx, cy, r, e);
  const large = e - s > 180 ? 1 : 0;
  return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
}

function MiniTicks({ n = 24, color = C.sub, h = 6 }) {
  const items = [];
  for (let i = 0; i < n; i++) {
    const major = i % 4 === 0;
    items.push(<span key={i} style={{ display: 'inline-block', width: 0.5, height: major ? h : h * 0.5, background: color, opacity: major ? 0.75 : 0.35, marginRight: 3, verticalAlign: 'bottom' }} />);
  }
  return <div style={{ lineHeight: 1, whiteSpace: 'nowrap' }}>{items}</div>;
}

function CornerTicks({ color = C.line }) {
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }}>
      <g stroke={color} strokeWidth="0.5" fill="none">
        <path d="M2 10 V2 H10 M90 2 H98 V10 M2 90 V98 H10 M90 98 H98 V90" />
      </g>
    </svg>
  );
}

/* 今日观测图：三层同心环 + 时间刻度 + 分段配速 + 放射引线 + 编号注释 + 四角密排小字 */
function ObservationChart() {
  const CX = 218, CY = 272;
  const palette = [C.gold, C.goldDeep, C.cream, C.red, C.goldBright];
  const ticks = [];
  for (let i = 0; i < 60; i++) {
    const a = i * 6, major = i % 5 === 0;
    const [x1, y1] = PT(CX, CY, major ? 162 : 171, a);
    const [x2, y2] = PT(CX, CY, 186, a);
    ticks.push(<line key={'t' + i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={C.sub} strokeWidth="0.5" opacity={major ? 0.85 : 0.35} />);
  }
  const timeLabels = ['19:30', '19:34', '19:38', '19:42', '19:46', '19:50', '19:54', '19:58'];
  const tl = [];

/* 细线刻度日历格 */
function CalendarGrid({ compact = false }) {
  const head = ['一', '二', '三', '四', '五', '六', '日'];
  const lead = [26, 27, 28, 29, 30, 31];
  const cells = [];
  lead.forEach((d, i) => cells.push({ k: 'l' + i, n: d, st: 'done' }));
  for (let d = 1; d <= 30; d++) {
    let st = 'idle';
    if (d <= 6) st = 'done';
    if (d === 8 || d === 11) st = 'plan';
    cells.push({ k: 'd' + d, n: d, st });
  }
  return (
    <div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: compact ? 2 : 3, marginBottom: 3 }}>
        {head.map(h => <div key={h} style={{ textAlign: 'center', fontSize: FS.xs, color: C.mut }}>{h}</div>)}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: compact ? 2 : 3 }}>
        {cells.map(c => (
          <div key={c.k} style={{
            height: compact ? 16 : 20, display: 'grid', placeItems: 'center', fontSize: FS.xs,
            border: '0.5px solid ' + (c.k === 'd6' ? C.gold : C.lineFaint),
            borderRadius: 4,
            background: c.k === 'd6' ? C.goldDeep : (c.st === 'done' ? C.panel2 : 'transparent'),
            color: c.k === 'd6' ? C.goldSoft : (c.st === 'done' ? C.text : (c.st === 'plan' ? C.gold : C.mut)),
            fontWeight: c.k === 'd6' ? 600 : 400,
          }}>{c.n}</div>
        ))}
      </div>
    </div>
  );
}

  } else if (kind && kind.indexOf('recordDetail') === 0) {
    const r = DATA.records[parseInt(kind.slice(-1), 10)] || DATA.records[0];

      <div>
        <div style={mandalaStyles.section}>单次记录 详情</div>

  return (
    <div data-modal={kind} className="modalAnim" style={{ position: 'absolute', inset: 0, zIndex: 60, display: 'flex', flexDirection: 'column' }}>

        {body}
        <div onClick={onClose} style={{ ...mandalaStyles.btnGhost, marginTop: 14 }}>关闭</div>
      </div>
    </div>
  );
}

/* ===== 单台手机：独立状态机 ===== */
function AppPhone({ idx, initial, platform, frameH }) {
  const [screen, setScreen] = useState(initial);
  const [modal, setModal] = useState(null);
  const [reminder, setReminder] = useState(true);
  const [paused, setPaused] = useState(false);
  const Frame = platform === 'android' ? AndroidFrame : IosFrame;
  const go = (s) => { setScreen(s); setModal(null); };
  const openModal = (m) => setModal(m);

  let content;
  if (screen === 'today') content = <TodayScreen openModal={openModal} />;
  else if (screen === 'plan') content = <PlanScreen reminder={reminder} setReminder={setReminder} openModal={openModal} />;
  else if (screen === 'running') content = <RunningScreen paused={paused} setPaused={setPaused} go={go} />;
  else if (screen === 'finish') content = <FinishScreen openModal={openModal} />;
  else content = <HistoryScreen openModal={openModal} />;

  return (
    <Frame width={330} height={frameH} darkMode={true} time="19:30" battery={86}>
      <div data-phone={idx} style={mandalaStyles.phoneRoot}>
        <div data-screen={screen} style={mandalaStyles.screenScroll}>{content}</div>
        <TabBar current={screen} onTab={go} phoneIdx={idx} />
        {modal && <Modal kind={modal} onClose={() => setModal(null)} reminder={reminder} go={go} />}
      </div>
    </Frame>
  );
}
