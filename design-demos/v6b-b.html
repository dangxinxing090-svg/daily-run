/* ============================================================
   色块地形：层叠的不规则柔和面块，只用色差分界，无闭合线条
   ============================================================ */

function bandBlob(cx, cy, rx, ry, seed) {
  const N = 11;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const wob = 1
      + 0.13 * Math.sin(3 * a + seed)
      + 0.07 * Math.cos(5 * a - seed * 0.7)
      + 0.04 * Math.sin(2 * a + seed * 0.45);
    pts.push([cx + rx * wob * Math.cos(a), cy + ry * wob * Math.sin(a)]);
  }
  const mids = pts.map((p, i) => [
    (p[0] + pts[(i + 1) % N][0]) / 2,
    (p[1] + pts[(i + 1) % N][1]) / 2,
  ]);
  let d = 'M' + mids[N - 1][0].toFixed(1) + ' ' + mids[N - 1][1].toFixed(1);
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const m = mids[i];
    d += ' Q ' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) +
         ' ' + m[0].toFixed(1) + ' ' + m[1].toFixed(1);
  }
  return d + ' Z';
}

function terrainBands(cx, cy, layers, seed) {
  return layers.map((l, i) => ({
    d: bandBlob(cx + l.dx, cy + l.dy, l.rx, l.ry, seed + i * 0.63),
    fill: l.fill,
    opacity: l.opacity == null ? 1 : l.opacity,
  }));
}

          <div className="num" style={{ ...topoStyles.num48, color: 'var(--sand-12)', lineHeight: 1 }}>{RUN.time}</div>
          <div style={{ ...topoStyles.label, marginTop: 5, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <Icon name="clock" size={16} />已用时间
          </div>
        </div>

        <div style={{ position: 'relative' }}>
          <TopoMap height={186} />
          <div style={{
            position: 'absolute', top: 10, right: 10, display: 'inline-flex', alignItems: 'center', gap: 6,
            background: 'var(--sand-1)', border: '0.5px solid var(--orange-6)', borderRadius: 999,
            padding: '5px 10px', color: 'var(--orange-11)',
          }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--orange-9)' }} />
            <span style={{ fontSize: 12, fontWeight: 600 }}>记录中</span>
          </div>
        </div>

        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <span style={topoStyles.kicker}>海拔剖面</span>
            <span className="num" style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-11)' }}>128 → 486 m</span>
          </div>
          <ElevationProfile height={46} />
        </div>

        <div style={{ ...topoStyles.card, display: 'flex', padding: '4px 0' }}>
          <StatCell icon="distance" label="距离" value={RUN.dist} borderRight />
          <StatCell icon="pace" label="配速" value={RUN.pace} borderRight />
          <StatCell icon="elevation" label="爬升" value={RUN.elev} />
        </div>

        <div style={{ display: 'flex', gap: 10, marginTop: 'auto' }}>
          <button data-act="pause" onClick={() => setPaused(!paused)}
            style={{ ...topoStyles.pill, ...topoStyles.pillGhost, flex: 1 }}>
            <Icon name="pause" size={16} />{paused ? '继续' : '暂停'}
          </button>
          <button data-act="end" onClick={onEnd}
            style={{ ...topoStyles.pill, ...topoStyles.pillMain, flex: 1 }}>
            <Icon name="finish" size={16} />结束
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={topoStyles.page}>
      <div style={topoStyles.hdr}>
        <span style={topoStyles.hdrBig}>完成</span>
        <span style={topoStyles.doneTag}><Icon name="check" size={16} />已打卡</span>
      </div>

      <div style={{ position: 'relative' }}>
        <TopoMap height={168} />
        <div style={{
          position: 'absolute', bottom: 10, right: 10,
          background: 'var(--sand-1)', border: '0.5px solid var(--sand-6)', borderRadius: 999,
          padding: '5px 10px', color: 'var(--sand-11)',
        }}>
          <span className="num" style={{ fontSize: 12, fontWeight: 600 }}>轨迹 {RUN.points} 点</span>
        </div>
      </div>

      <div style={{ ...topoStyles.card, padding: '10px 14px' }}>
        <div style={topoStyles.label}>本次距离</div>
        <div className="num" style={{ ...topoStyles.num48, color: 'var(--sand-12)', lineHeight: 1.05, marginTop: 4 }}>
          {RUN.dist}
        </div>
        <div style={{ display: 'flex', gap: 16, marginTop: 10 }}>
          <span className="num" style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)', display: 'inline-flex', alignItems: 'center', gap: 5 }}>
            <Icon name="clock" size={16} />{RUN.time}
          </span>
          <span className="num" style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)', display: 'inline-flex', alignItems: 'center', gap: 5 }}>
            <Icon name="pace" size={16} />{RUN.pace}
          </span>
          <span className="num" style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)', display: 'inline-flex', alignItems: 'center', gap: 5 }}>
            <Icon name="flame" size={16} />{RUN.kcal}
          </span>
        </div>
      </div>

      <div style={{ ...topoStyles.card, padding: '8px 14px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={topoStyles.kicker}>海拔剖面</span>
          <span className="num" style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-11)' }}>最高 {RUN.elev}</span>
        </div>
        <ElevationProfile height={36} />
      </div>

      <div style={{ display: 'flex', gap: 10, marginTop: 'auto' }}>
        <button data-act="finishData" onClick={onFinishData}
          style={{ ...topoStyles.pill, ...topoStyles.pillMain, flex: 1, fontSize: 12, padding: '11px 8px' }}>
          <Icon name="route" size={16} />查看完成数据
        </button>
        <button data-act="again" onClick={onAgain}
          style={{ ...topoStyles.pill, ...topoStyles.pillGhost, flex: 1 }}>
          <Icon name="play" size={16} />再跑一次
        </button>
      </div>
    </div>
  );
}

function HistoryScreen({ open }) {
  const lead = 6;
  const days = [...Array(lead).fill(null), ...Array.from({ length: 30 }, (_, i) => i + 1)];
  const doneSet = [19, 20, 21, 22, 23];
  const records = [RUN.rec1, RUN.rec2];

  return (
    <div style={{ ...topoStyles.page, gap: 8 }}>

      <div style={topoStyles.hdr}>
        <span style={topoStyles.hdrBig}>记录</span>
        <span style={topoStyles.hdrSmall}>十一月</span>
      </div>

      <div style={{ ...topoStyles.card, display: 'flex', padding: '4px 0' }}>
        <StatCell icon="distance" label="本月里程" value={RUN.monthKm} borderRight />
        <StatCell icon="calendar" label="打卡次数" value={RUN.monthCount} />
      </div>

      <div style={{ ...topoStyles.card, padding: '10px 14px' }}>
        <div style={topoStyles.row}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
            <Icon name="calendar" size={16} />
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)' }}>11 月月历</span>
          </span>
          <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-11)' }}>周一起</span>
        </div>
        <div style={topoStyles.calGrid}>
          {['一', '二', '三', '四', '五', '六', '日'].map((h, i) =>
            <div key={'h' + i} style={topoStyles.calHead}>{h}</div>
          )}
          {days.map((d, i) => (
            <div key={'d' + i} style={{
              ...topoStyles.calCell,
              ...(d === null ? { background: 'transparent', border: '0.5px solid transparent' } : {}),
              ...(d !== null && doneSet.indexOf(d) >= 0 ? topoStyles.calDone : {}),
              ...(d === 24 ? topoStyles.calToday : {}),
            }}>{d === null ? '' : d}</div>
          ))}
        </div>
      </div>

      <div style={topoStyles.label}>历史记录</div>

      {records.map((r, i) => (
        <div key={i} data-act={'rec' + i} onClick={() => open('rec' + i)}
          style={{ ...topoStyles.card, padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
          <div style={{ width: 54, height: 46, flex: '0 0 auto' }}>
            <TopoMap height={46} viewBox="50 96 220 220" radius={8} track />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)' }}>{r.date}</span>
              <span className="num" style={{ fontSize: 14, fontWeight: 600, color: 'var(--orange-11)' }}>{r.dist}</span>
            </div>
            <div className="num" style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-11)', marginTop: 6 }}>
              {r.time}　{r.pace}
            </div>
          </div>
          <Icon name="chevron" size={16} />
        </div>
      ))}

    </div>
  );
}

/* ============================================================
   弹层内容
   ============================================================ */

function ModalBody({ kind, onClose }) {
  if (kind === 'finishData') {
    return (
      <TopoModal title="完成数据" onClose={onClose}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
          <span className="num" style={{ fontSize: 28, fontWeight: 600, color: 'var(--sand-12)' }}>{RUN.dist}</span>
          <span className="num" style={{ fontSize: 20, fontWeight: 600, color: 'var(--sand-12)' }}>{RUN.time}</span>
        </div>
        <div style={{ marginTop: 10 }}>
          <TopoMap height={132} />
        </div>
        <div style={{ display: 'flex', marginTop: 12, padding: '8px 0', borderTop: '0.5px solid var(--sand-6)', borderBottom: '0.5px solid var(--sand-6)' }}>
          <StatCell icon="pace" label="配速" value={RUN.pace} borderRight />
          <StatCell icon="flame" label="消耗" value={RUN.kcal} borderRight />
          <StatCell icon="route" label="轨迹点" value={String(RUN.points)} />
        </div>
        <div style={{ marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)' }}>分段配速</span>
          <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--sand-11)' }}>每公里</span>
        </div>
        <div style={{ marginTop: 10 }}><PaceSegments /></div>
        <button data-act="saveRecord" onClick={onClose}
          style={{ ...topoStyles.pill, ...topoStyles.pillMain, width: '100%', marginTop: 14 }}>
          <Icon name="share" size={16} />保存记录图
        </button>
      </TopoModal>
    );
  }

  if (kind === 'rec0' || kind === 'rec1') {
    const r = kind === 'rec0' ? RUN.rec1 : RUN.rec2;
    return (
      <TopoModal title="单次记录" onClose={onClose}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--sand-12)' }}>{r.date}</span>
          <span style={topoStyles.doneTag}><Icon name="check" size={16} />已完成</span>
        </div>
        <div className="num" style={{ fontSize: 28, fontWeight: 600, color: 'var(--orange-11)', marginTop: 6 }}>{r.dist}</div>
        <div style={{ marginTop: 10 }}>
          <TopoMap height={130} />
        </div>
        <div style={{ display: 'flex', marginTop: 12, padding: '8px 0', borderTop: '0.5px solid var(--sand-6)', borderBottom: '0.5px solid var(--sand-6)' }}>
          <StatCell icon="clock" label="用时" value={r.time} borderRight />
          <StatCell icon="pace" label="配速" value={r.pace} borderRight />
          <StatCell icon="route" label="轨迹点" value={String(r.points)} />
        </div>
        <div style={{ marginTop: 10 }}>
          <ElevationProfile height={38} />
        </div>
        <button data-act="genRecord" onClick={onClose}
          style={{ ...topoStyles.pill, ...topoStyles.pillMain, width: '100%', marginTop: 12 }}>
          <Icon name="share" size={16} />生成记录图
        </button>
      </TopoModal>
    );
  }

  return null;
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, initialRun, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [runState, setRunState] = React.useState(initialRun || 'idle');
  const [modal, setModal] = React.useState(null);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);
  const startRun = () => { setRunState('live'); setPaused(false); setScreen('running'); setModal(null); };
  const endRun = () => { setRunState('result'); setModal(null); };
  const again = () => { setRunState('live'); setPaused(false); setModal(null); };

  const screenEl = (() => {
    switch (screen) {
      case 'today': return <TodayScreen onStart={startRun} />;
      case 'running': return (
        <RunningScreen
          runState={runState}
          onStart={startRun}
          onEnd={endRun}
          onAgain={again}
          onFinishData={() => open('finishData')}
          paused={paused}
          setPaused={setPaused}
        />
      );
      case 'history': return <HistoryScreen open={open} />;
      default: return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={topoStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...topoStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={topoStyles.boardNum}>{num}</span>
        <span style={topoStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}

/* ============================================================
   展示板：主次放大构图
   ============================================================ */

  return (
    <svg viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice"
      style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }}>
      {BOARD_BANDS.map((b, i) => (
        <path key={'band' + i} d={b.d} fill={b.fill} opacity={b.opacity} />
      ))}

  );
}

function Board() {

    <div style={topoStyles.board}>

      <div style={topoStyles.head}>

        <div style={topoStyles.sub}>定位　滨海丘陵　海拔 128 m</div>
        <div style={topoStyles.chips}>

      <AppPhone initial="today" initialRun="idle" Frame="android" scale={0.95}
        left={64} top={265} z={4} num="01" label="今日" labelTop={930} />
      <AppPhone initial="running" initialRun="result" Frame="ios" scale={1.25}

      <AppPhone initial="history" initialRun="idle" Frame="android" scale={0.95}

}

ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
