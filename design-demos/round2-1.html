/* ============================================================
   程序化图形
   ============================================================ */

function StreetMap({ w = '100%', h = 160, grid = 'var(--indigo-4)', track = 'var(--indigo-9)', lw = 3, opacity = 1 }) {
  return (
    <svg viewBox="0 0 240 160" preserveAspectRatio="none" style={{ width: w, height: h, display: 'block', opacity }}>
      <g style={{ stroke: grid, strokeWidth: 0.5, fill: 'none', opacity: 0.9 }}>
        <path d="M0 34 H240 M0 86 H240 M0 132 H240 M46 0 V160 M112 0 V160 M180 0 V160" />
        <path d="M0 0 L240 160 M240 0 L0 160" style={{ opacity: 0.5 }} />
      </g>
      <path d="M22 132 C60 120 74 56 120 62 S172 128 208 92"
        style={{ fill: 'none', stroke: track, strokeWidth: lw, strokeLinecap: 'round', strokeLinejoin: 'round' }} />
      <circle cx="22" cy="132" r={lw} style={{ fill: track }} />
      <circle cx="208" cy="92" r={lw + 1} style={{ fill: track }} />
    </svg>
  );
}

function TrendChart({ h = 40 }) {
  const vals = [0.42, 0.6, 0.5, 0.78, 0.66, 0.9, 0.72, 0.84];
  const pts = vals.map((v, i) => `${8 + i * 31},${34 - v * 30}`).join(' ');
  return (
    <svg viewBox="0 0 240 40" preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <polyline points={pts} fill="none" stroke="var(--indigo-9)" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      {vals.map((v, i) => <circle key={i} cx={8 + i * 31} cy={34 - v * 30} r="1.8" fill="var(--indigo-9)" />)}
    </svg>
  );
}

function CalStrip({ bottom, style }) {
  return (
    <div style={{ ...posterStyles.calStrip, bottom, ...style }}>
      {CAL_DAYS.map((d, i) => (
        <span key={i} style={
          d === CAL_TODAY ? posterStyles.calToday : (CAL_DONE.indexOf(d) >= 0 ? posterStyles.calDone : posterStyles.calNum)
        }>{d}</span>
      ))}
    </div>
  );
}

function Glyph({ text, size, sx }) {
  return (
    <div style={posterStyles.glyphWrap}>
      <span style={{
        ...posterStyles.glyph, fontSize: size,
        transform: sx ? 'scaleX(' + sx + ')' : 'none',
      }}>{text}</span>
    </div>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={340} height={640} time="19:30" battery={82} darkMode={false}>
          <div style={posterStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...posterStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={posterStyles.boardNum}>{num}</span>
        <span style={posterStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}
