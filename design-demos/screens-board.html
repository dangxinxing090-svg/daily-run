<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日跑步 五屏</title>
<style>
:root{--slate-1:#fcfcfd;--slate-6:#d9d9e0;--slate-11:#60646c;--slate-12:#1c2024;--orange-9:#f76b15;--orange-2:#fff7ed}
*{box-sizing:border-box}
body{margin:0;background:var(--slate-1);color:var(--slate-12);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;padding:26px 30px 30px}
.head{display:flex;align-items:baseline;gap:14px;border-bottom:.5px solid var(--slate-6);padding-bottom:14px;margin-bottom:20px}
h1{font-size:20px;font-weight:600;margin:0}
.note{font-size:12px;color:var(--slate-11)}
.row{display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.item{width:236px}
.item img{width:236px;height:auto;display:block;border:.5px solid var(--slate-6);border-radius:12px}
.cap{display:flex;align-items:center;gap:8px;margin:9px 0 0;font-size:12px;color:var(--slate-11)}
.num{font-size:12px;font-weight:600;color:var(--orange-9);font-variant-numeric:tabular-nums}
.state{margin-left:auto;color:var(--slate-11)}
</style>
</head>
<body>
<div class="head"><h1>每日跑步 五屏</h1><span class="note">定稿浅底橙　Flutter Web 实测截图　2026-11-06</span></div>
<div class="row">
  <div class="item"><img src="screen-today.png" alt="今日"><div class="cap"><span class="num">01</span> 今日</div></div>
  <div class="item"><img src="screen-plan.png" alt="计划"><div class="cap"><span class="num">02</span> 计划</div></div>
  <div class="item"><img src="screen-running.png" alt="跑中"><div class="cap"><span class="num">03</span> 跑中</div></div>
  <div class="item"><img src="screen-finish-done.png" alt="完成"><div class="cap"><span class="num">04</span> 完成</div></div>
  <div class="item"><img src="screen-history.png" alt="记录"><div class="cap"><span class="num">05</span> 记录</div></div>
</div>
</body>
</html>
