/* ============================================================
   通用组件：TabBar / Modal / 开关
   ============================================================ */

function TabBar({ current, onTab }) {
  return (
    <div data-act="tabbar" style={softEdgeStyles.tabbar}>
      {TABS.map(t => {
        const on = current === t.key;
        return (
          <button key={t.key} data-tab={t.key} onClick={() => onTab(t.key)}
            style={{
              ...softEdgeStyles.tabItem,
              fontWeight: on ? 600 : 400,
              color: on ? 'var(--orange-11)' : 'var(--sand-11)',
            }}>
            <Icon name={t.icon} size={20} />
            {t.label}
          </button>
        );
      })}
    </div>
  );
}

function SoftModal({ title, onClose, children }) {
  return (

function AppPhone({ initial, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={softEdgeStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...softEdgeStyles.boardLabel, left: left + 8, top: labelTop, zIndex: z }}>
        <span style={softEdgeStyles.boardNum}>{num}</span>
        <span style={softEdgeStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}

/* ============================================================

        <div style={softEdgeStyles.specTag}><Icon name="check" size={16} />已自动打卡　连续 {RUN.streak}</div>
        <div style={softEdgeStyles.specFoot}>11月累计 {RUN.monthKm}　{RUN.monthCount}打卡</div>

      {/* 放大的周历条局部 */}
      <div style={softEdgeStyles.specWeekHead}>本周打卡</div>
      <div style={softEdgeStyles.specWeek}>
        {[
          { d: '2', s: 'done' }, { d: '3', s: 'done' }, { d: '4', s: 'done' },
          { d: '5', s: 'done' }, { d: '6', s: 'today' }, { d: '7', s: '' }, { d: '8', s: '' },
        ].map((c, i) => (

      {/* 引线：0.5px 细线 + 端点圆，浮于卡片之上 */}
      <svg viewBox="0 0 380 860" preserveAspectRatio="none"
        style={{ position: 'absolute', left: 0, top: 0, width: 380, height: 860, pointerEvents: 'none' }}>
        <g stroke="var(--sand-8)" strokeWidth="1" fill="none">
          <line x1="112" y1="204" x2="100" y2="264" />
          <line x1="262" y1="204" x2="290" y2="264" />
          <line x1="128" y1="558" x2="130" y2="486" />
          <line x1="252" y1="558" x2="270" y2="486" />
        </g>
        <g fill="var(--orange-9)">
          <circle cx="100" cy="264" r="3" />
          <circle cx="290" cy="264" r="3" />
          <circle cx="130" cy="486" r="3" />
          <circle cx="270" cy="486" r="3" />
        </g>
      </svg>

      {/* 标注只能是数据或图表读法 */}
      <div style={{ ...softEdgeStyles.leaderText, left: 24, top: 186 }}>5.21 km</div>
      <div style={{ ...softEdgeStyles.leaderText, left: 214, top: 186 }}>连续 13 天</div>
      <div style={{ ...softEdgeStyles.leaderText, left: 24, top: 554 }}>42.6 km　8 次打卡</div>
      <div style={{ ...softEdgeStyles.leaderText, left: 216, top: 554 }}>平均配速 6'02"</div>

}

/* ============================================================
   展示板：局部特写构图
   ============================================================ */

    <div style={softEdgeStyles.board}>

      <AppPhone initial="running" Frame="ios"     scale={0.68} left={258}  top={170} z={4} num="03" label="跑中" labelTop={144} />
      <AppPhone initial="today"   Frame="ios"     scale={0.68} left={492}  top={170} z={6} num="01" label="今日" labelTop={144} />

ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
</body>
