   几何叠印：圆、三角、斜条带、网点，全部低不透明度，置于内容之下
   ============================================================ */

function Geo(g) {
  if (g.t === 'circle') return (
    <div key={g.k} style={{ position: 'absolute', width: g.s, height: g.s, borderRadius: '50%',
      background: g.c, opacity: g.o, left: g.l, top: g.tp, zIndex: g.z || 0 }} />
  );
  if (g.t === 'tri') return (
    <div key={g.k} style={{ position: 'absolute', width: 0, height: 0,
      borderLeft: `${g.s / 2}px solid transparent`, borderRight: `${g.s / 2}px solid transparent`,
      borderBottom: `${g.s}px solid ${g.c}`, left: g.l, top: g.tp,
      transform: `rotate(${g.r}deg)`, opacity: g.o, zIndex: g.z || 0 }} />
  );
  if (g.t === 'band') return (
    <div key={g.k} style={{ position: 'absolute', left: g.l, top: g.tp, width: g.w, height: g.h,
      background: g.c, transform: `rotate(${g.r}deg)`, opacity: g.o, zIndex: g.z || 0 }} />
  );
  if (g.t === 'dots') return (
    <div key={g.k} style={{ position: 'absolute', left: g.l, top: g.tp, width: g.w, height: g.h,
      backgroundImage: `radial-gradient(${g.c} 1.5px, transparent 1.5px)`,
      backgroundSize: '12px 12px', opacity: g.o, zIndex: g.z || 0 }} />
  );
  return null;
}

const CAL_HEAD = ['一', '二', '三', '四', '五', '六', '日'];

function CircleCalendar({ days, title, right }) {
  return (
    <div style={newWaveStyles.card}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 7 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 14, fontWeight: 600, color: 'var(--slate-12)' }}>

        <span style={newWaveStyles.txt12}>{right}</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 5, marginBottom: 5 }}>
        {CAL_HEAD.map(h => <div key={h} style={{ textAlign: 'center', fontSize: 12, fontWeight: 500, color: 'var(--slate-11)' }}>{h}</div>)}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 5, justifyItems: 'center' }}>
        {days.map((c, i) => {
          let cell = { background: 'var(--amber-1)', color: 'var(--slate-11)', border: '0.5px solid var(--slate-6)' };
          if (c.s === 'done') cell = { background: 'var(--teal-3)', color: 'var(--teal-12)', border: '0.5px solid var(--teal-9)' };
          if (c.s === 'today') cell = { background: 'var(--amber-9)', color: 'var(--amber-12)', border: '0.5px solid var(--amber-11)' };
          return (
            <div key={i} style={{
              width: 28, height: 28, borderRadius: '50%', display: 'flex',
              alignItems: 'center', justifyContent: 'center',
              fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
              transform: `translateY(${CAL_OFF[i % CAL_OFF.length]}px) rotate(${(i % 3 - 1) * 3}deg)`,
              ...cell,
            }}>{c.d}</div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, Frame, scale, left, top, z, num, label }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;
  const labelTop = top + 682 * scale + 8;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={newWaveStyles.screenRoot}>
            <GeoScene v={VARIANT[screen]} />
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...newWaveStyles.boardLabel, left, top: labelTop }}>
        <span style={newWaveStyles.boardNum}>{num}</span>
        <span style={newWaveStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}

        <div style={newWaveStyles.tagline}>计划到打卡 跑完自动留痕</div>
        <div style={newWaveStyles.chips}>
          {SCREEN_LABELS.map((s, i) => (
            <div key={s.num} style={{
              ...newWaveStyles.chip,
              ...(i === 2 ? newWaveStyles.chip2 : {}),
              ...(i === 3 ? newWaveStyles.chip3 : {}),
              transform: `rotate(${(i % 3 - 1) * 3}deg)`,
            }}>
              <Icon name={s.icon} size={16} />{s.num} {s.label}
            </div>
          ))}
        </div>
      </div>

      <div style={newWaveStyles.meta}>
        <div style={newWaveStyles.metaA}>方向 02　加州新浪潮</div>
        <div style={newWaveStyles.metaB}>2026-11-06　iOS + Android</div>
      </div>

      <AppPhone initial="today"   Frame="ios"     scale={0.89} left={14}   top={280} z={6}  num="01" label="今日" />
      <AppPhone initial="plan"    Frame="android" scale={0.89} left={331}  top={370} z={7}  num="02" label="计划" />
      <AppPhone initial="running" Frame="ios"     scale={0.89} left={648}  top={250} z={9}  num="03" label="跑中" />
      <AppPhone initial="finish"  Frame="ios"     scale={0.89} left={965}  top={350} z={6}  num="04" label="完成" />
      <AppPhone initial="history" Frame="android" scale={0.89} left={1282} top={275} z={7}  num="05" label="记录" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
</body>
</html>
