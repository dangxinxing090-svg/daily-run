function IosFrame({
  children,
  width = 393,
  height = 852,
  time = '9:41',
  battery = 100,
  darkMode = false,
  showStatusBar = true,
  showDynamicIsland = true,
  showHomeIndicator = true,
}) {
  const textColor = darkMode ? '#fff' : '#000';

  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{
        ...iosFrameStyles.screen,
        width,
        height,
        background: darkMode ? '#000' : 'var(--sand-3)',

        {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}

        <div style={iosFrameStyles.content}>
          {children}

        {showHomeIndicator && (
          <div style={{
            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
          }} />
        )}
      </div>
    </div>
  );

function CalGrid({ days }) {

  return (
    <div style={surfaceStyles.calGrid}>
      {calHead.map(h => <div key={h} style={surfaceStyles.calHead}>{h}</div>)}
      {days.map((c, i) => {
        const done = c.s === 'done';
        const today = c.s === 'today';
        return (
          <div key={i} className={today ? 'nm-press' : 'nm-raise'}
            style={{
              ...surfaceStyles.calCell,
              ...(today ? { color: 'var(--sand-12)', fontWeight: 600 } : {}),
            }}>
            {c.d}
            {done && <span style={{ ...surfaceStyles.dot, background: 'var(--teal-9)' }} />}
            {today && <span style={{ ...surfaceStyles.dot, background: 'var(--sand-9)' }} />}
            {!done && !today && <span style={{ ...surfaceStyles.dot, background: 'transparent' }} />}
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [modal, setModal] = React.useState(null);
  const [reminder, setReminder] = React.useState(true);
  const [paused, setPaused] = React.useState(false);

  const go = (s) => { setScreen(s); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen open={open} />;
      case 'plan':    return <PlanScreen open={open} reminder={reminder} toggleReminder={() => setReminder(!reminder)} />;
      case 'running': return <RunningScreen go={go} paused={paused} setPaused={setPaused} />;
      case 'finish':  return <FinishScreen open={open} />;
      case 'history': return <HistoryScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={700} time="19:30" battery={82} darkMode={false}>
          <div style={surfaceStyles.screenRoot}>
            {screenEl}
            {screen !== 'running' && <TabBar current={screen} onTab={go} />}
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} reminder={reminder} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...surfaceStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span className="nm-raise" style={surfaceStyles.boardNum}>{num}</span>
        <span style={surfaceStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}
