<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#faf9f7;color:#1c2024;padding:34px 40px}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
p.sub{font-size:13px;color:#60646c;margin-bottom:26px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.item{background:#fff;border:.5px solid #d9d9e0;border-radius:14px;padding:14px}
.item img{width:100%;display:block;border-radius:8px;border:.5px solid #eee}
.cap{margin-top:12px}
.cap b{font-size:15px;font-weight:700}
.cap span{display:block;font-size:12px;color:#60646c;margin-top:5px;line-height:1.6}
.num{display:inline-block;font-size:12px;font-weight:700;color:#cc4e00;margin-right:8px}
</style></head><body>
<h1>每日跑步　三个全新方向</h1>
<p class="sub">颜色、字体、排版、风格全部拉开。三页功能一致，全部浅色底，带统一图标，可点击原型在各手机里切页开跑。</p>
<div class="row">
  <div class="item"><img src="v6-1.png" alt="纸上跑刊"><div class="cap"><b><span class="num">01</span>纸上跑刊</b><span>宋体衬线与文章分栏，纸白加朱红。字体气质与其余两版完全不同。</span></div></div>
  <div class="item"><img src="v6-2.png" alt="等高线地形"><div class="cap"><b><span class="num">02</span>等高线地形</b><span>沙绿大地色与等高线主图，橙红轨迹穿过地形。中间主屏放大。</span></div></div>
  <div class="item"><img src="v6-3.png" alt="纸面仪表"><div class="cap"><b><span class="num">03</span>纸面仪表</b><span>浅色反转的工业仪表，等宽数字与圆形读数窗，右侧局部特写。</span></div></div>
</div>
</body></html>
