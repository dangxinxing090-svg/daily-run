function IosFrame({
  children,
  width = 393,
  height = 852,
  time = '9:41',
  battery = 100,
  darkMode = false,
  showStatusBar = true,
  showDynamicIsland = true,
  showHomeIndicator = true,
}) {
  const textColor = darkMode ? '#fff' : '#000';

  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{
        ...iosFrameStyles.screen,
        width,
        height,
        background: darkMode ? '#000' : '#fff',

            <span>{time}</span>
            <div style={iosFrameStyles.statusIcons}>

                  borderRadius: 1,
                  opacity: 0.9,

              </div>
            </div>
          </div>
        )}

        {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}

        <div style={iosFrameStyles.content}>
          {children}
        </div>

        {showHomeIndicator && (
          <div style={{
            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
          }} />
        )}
      </div>
    </div>
  );
}

/* ============================================================
   流场图形：斜切流带 / 被切开的巨字 / 抽象街区 / 轨迹
   ============================================================ */

function FlowBand({ clip, style, gradient }) {
  return (
    <div style={{
      position: 'absolute', background: gradient || FLOW, clipPath: clip,
      pointerEvents: 'none', ...style,
    }} />
  );
}

/* 同一文字画两层：底层 slate-12，流带层内白字，形成被流带斜切的两色巨字 */
function CutText({ text, size = 76, clip = 'polygon(0 0, 100% 0, 100% 54%, 0 80%)', style }) {
  const numStyle = {
    fontSize: size, fontWeight: 700, fontVariantNumeric: 'tabular-nums',
    letterSpacing: '-0.05em', lineHeight: 1, whiteSpace: 'nowrap',
  };
  return (
    <span style={{ position: 'relative', display: 'inline-block', ...style }}>
      <span style={{ position: 'relative', zIndex: 0, color: 'var(--slate-12)', ...numStyle }}>{text}</span>
      <span style={{ position: 'absolute', inset: 0, zIndex: 1, background: FLOW, clipPath: clip }} />
      <span style={{ position: 'absolute', inset: 0, zIndex: 2, color: 'var(--orange-1)', clipPath: clip, ...numStyle }}>{text}</span>
    </span>
  );
}

function StreetMap({ h = 130, grid = 'var(--slate-7)', track = 'var(--orange-9)', lw = 5, white = false }) {
  return (
    <svg viewBox="0 0 240 160" preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <g style={{ stroke: grid, strokeWidth: 0.5, fill: 'none', opacity: 0.7 }}>
        <path d="M0 34 H240 M0 86 H240 M0 132 H240 M46 0 V160 M112 0 V160 M180 0 V160" />
        <path d="M0 0 L240 160 M240 0 L0 160" style={{ opacity: 0.35 }} />
      </g>
      <path d="M22 132 C60 120 74 56 120 62 S172 128 208 92"
        style={{ fill: 'none', stroke: track, strokeWidth: lw, strokeLinecap: 'round', strokeLinejoin: 'round' }} />
      <circle cx="22" cy="132" r={lw} style={{ fill: track }} />
      <circle cx="208" cy="92" r={lw + 1} style={{ fill: track }} />
      {white && <circle cx="208" cy="92" r={Math.max(1.5, lw - 2.5)} style={{ fill: 'var(--orange-1)' }} />}
    </svg>
  );
}

            <Icon name={t.icon} size={20} />

function ModalBody({ kind, record, onClose, onShare }) {
  if (kind === 'finish') {
    return <FinishDetailSheet onClose={onClose} onShare={() => onShare('finish')} />;
  }
  if (kind === 'record') {
    return <RecordDetailSheet rec={record} onClose={onClose} onShare={() => onShare('record')} />;
  }
  if (kind === 'shareFinish') {
    return <ShareCardSheet title="记录图" onClose={onClose}
      dist={RUN.finishDist} time={RUN.finishTime} pace={RUN.finishPace} />;
  }
  if (kind === 'shareRecord') {
    return <ShareCardSheet title="记录图" onClose={onClose}
      dist={record.dist} time={record.time} pace={record.pace} />;
  }
  return null;
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, initialRun, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [runState, setRunState] = React.useState(initialRun || 'idle');
  const [paused, setPaused] = React.useState(false);
  const [modal, setModal] = React.useState(null);
  const [record, setRecord] = React.useState(null);

  const go = (s) => { setScreen(s); setModal(null); };
  const start = () => { setPaused(false); setRunState('live'); setScreen('running'); setModal(null); };
  const end = () => { setPaused(false); setRunState('result'); };
  const again = () => { setPaused(false); setRunState('live'); };
  const openRec = (i) => { setRecord(HISTORY[i]); setModal('record'); };
  const onShare = (from) => setModal(from === 'finish' ? 'shareFinish' : 'shareRecord');

  let screenEl;
  if (screen === 'today') {
    screenEl = <TodayScreen onStart={start} />;
  } else if (screen === 'running') {
    if (runState === 'idle') screenEl = <RunningIdle onStart={start} />;
    else if (runState === 'live') screenEl = <RunningLive paused={paused} onPause={() => setPaused(!paused)} onEnd={end} />;
    else screenEl = <RunningResult onSheet={() => setModal('finish')} onAgain={again} />;
  } else {
    screenEl = <HistoryScreen onRec={openRec} />;
  }

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;
  const showTab = !(screen === 'running' && runState === 'live');

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={Frame === 'android' ? 360 : 340} height={Frame === 'android' ? 720 : 700}
          time="19:30" battery={82} darkMode={false}>
          <div style={fieldStyles.screenRoot}>
            {screenEl}
            {showTab && <TabBar current={screen} onTab={go} />}
            {modal && <ModalBody kind={modal} record={record} onClose={() => setModal(null)} onShare={onShare} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...fieldStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={fieldStyles.boardNum}>{num}</span>
        <span style={fieldStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}
