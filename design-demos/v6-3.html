function IosFrame({
  children,
  width = 393,
  height = 852,
  time = '9:41',
  battery = 100,
  darkMode = false,
  showStatusBar = true,
  showDynamicIsland = true,
  showHomeIndicator = true,
}) {
  const textColor = darkMode ? '#fff' : '#000';

  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{
        ...iosFrameStyles.screen,
        width,
        height,
        background: darkMode ? '#000' : '#fff',

        <div style={iosFrameStyles.content}>
          {children}

        {showHomeIndicator && (
          <div style={{
            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
          }} />
        )}
      </div>
    </div>
  );
}

/* ============================================================
   图形组件：刻度、圆形读数窗、轨迹线、分段条
   ============================================================ */

function TickStrip({ count = 22, active = -1 }) {
  const items = [];
  for (let i = 0; i < count; i++) {
    const major = i % 5 === 0;
    const h = major ? 14 : 8;
    items.push(
      <span key={i} style={{
        ...instrumentStyles.tick,
        height: h,
        ...(major ? instrumentStyles.tickMajor : {}),
        ...(i === active ? instrumentStyles.tickOn : {}),
      }} />
    );
  }
  return <div style={instrumentStyles.tickRow}>{items}</div>;
}

function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function arcPath(cx, cy, r, endDeg) {
  const [x1, y1] = polar(cx, cy, r, 0);
  const [x2, y2] = polar(cx, cy, r, endDeg);
  const large = endDeg > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

function Gauge({ d = 200, value = '5.37', unit = 'km', progress = 0.895, valueSize = 56 }) {
  const ticks = [];
  for (let i = 0; i < 60; i++) {
    const deg = i * 6;
    const major = i % 5 === 0;
    const r1 = major ? 78 : 84;
    const [x1, y1] = polar(100, 100, r1, deg);
    const [x2, y2] = polar(100, 100, 92, deg);
    ticks.push(
      <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
        stroke={major ? 'var(--gray-8)' : 'var(--gray-6)'} strokeWidth={major ? 1.4 : 0.8} />
    );
  }
  const endDeg = Math.min(progress, 0.999) * 360;
  const [px1, py1] = polar(100, 100, 72, endDeg);
  const [px2, py2] = polar(100, 100, 90, endDeg);
  return (
    <svg width={d} height={d} viewBox="0 0 200 200" style={{ display: 'block', overflow: 'visible' }}>
      <circle cx="100" cy="100" r="96" fill="var(--gray-1)" stroke="var(--gray-6)" strokeWidth="0.5" />
      <circle cx="100" cy="100" r="74" fill="none" stroke="var(--gray-5)" strokeWidth="0.5" />
      {ticks}
      <path d={arcPath(100, 100, 86, endDeg)} fill="none" stroke="var(--orange-9)" strokeWidth="2.6" strokeLinecap="round" />
      <line x1={px1} y1={py1} x2={px2} y2={py2} stroke="var(--orange-9)" strokeWidth="3" strokeLinecap="round" />
      <text x="100" y="100" textAnchor="middle" dominantBaseline="central"
        fontSize={valueSize} fontFamily={MONO} fill="var(--gray-12)"
        style={{ ...NUM, letterSpacing: '-0.04em' }}>{value}</text>
      <text x="100" y="148" textAnchor="middle" fontSize="12" fontFamily={MONO}
        fill="var(--gray-11)" style={{ letterSpacing: '0.14em' }}>{unit}</text>
    </svg>
  );
}

  return (
    <svg viewBox="0 0 240 120" preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>

        <path d="M0 120 L240 0 M240 120 L0 0" stroke="var(--gray-7)" opacity="0.6" />

  if (runState === 'idle') {
    return (
      <div style={instrumentStyles.page}>

        <div style={instrumentStyles.hdr}>
          <span style={instrumentStyles.hdrBig}>跑中</span>
          <span style={instrumentStyles.hdrSmall}>未开始</span>
        </div>

        <div style={instrumentStyles.window}>
          <div style={instrumentStyles.windowTop}>
            <span style={instrumentStyles.label}>目标</span>
            <span style={instrumentStyles.label}><IconLabel name="target" size={16}>计划</IconLabel></span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={instrumentStyles.num56}>{RUN.target}</span>
            <span style={instrumentStyles.unit16}>km</span>
          </div>
          <TickStrip count={20} active={19} />
        </div>

        <div style={{ marginTop: 24, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <div style={{
            width: 128, height: 128, borderRadius: 999, border: '0.5px solid var(--orange-9)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--gray-1)',
          }}>
            <button data-act="start" onClick={start} style={{
              width: 92, height: 92, borderRadius: 999, border: '0.5px solid var(--gray-6)',
              background: 'var(--gray-2)', color: 'var(--gray-12)', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4,
            }}>
              <Icon name="play" size={20} />
              <span style={{ fontSize: 12, fontWeight: 600 }}>启动</span>
            </button>
          </div>
          <span style={instrumentStyles.label}>{RUN.date}</span>
        </div>

        <div style={{ marginTop: 'auto' }}><TickStrip count={24} /></div>
      </div>
    );
  }

  if (runState === 'live') {
    return (
      <div style={instrumentStyles.pagePlain}>

        <div style={instrumentStyles.hdr}>
          <span style={instrumentStyles.hdrBig}>跑中</span>
          <span style={instrumentStyles.liveTag}><span style={instrumentStyles.liveDot} />实时</span>
        </div>

        <div style={instrumentStyles.gaugeWrap}>
          <span style={instrumentStyles.gaugeTag}>距离</span>
          <span style={instrumentStyles.gaugeTagRight}>0 / 6</span>
          <Gauge d={200} value={RUN.liveDist} unit="km" progress={0.803} />
        </div>

        <div style={instrumentStyles.dataRow}>
          <DataCell icon="clock" label="已用时间" value={RUN.liveTime} />
          <DataCell icon="pace" label="当前配速" value={RUN.livePace} />
        </div>

        <div style={{ ...instrumentStyles.window, padding: '9px 12px 10px' }}>
          <div style={instrumentStyles.label}><IconLabel name="route" size={16}>轨迹读数</IconLabel></div>
          <TickStrip count={24} active={16} />
        </div>

        <div style={instrumentStyles.btnRow}>
          <button data-act="pause" onClick={() => setPaused(!paused)} style={instrumentStyles.btnGhost}>
            <Icon name="pause" size={16} />{paused ? '继续' : '暂停'}
          </button>
          <button data-act="end" onClick={end} style={instrumentStyles.btnSolid}>
            <Icon name="stop" size={16} />结束
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={instrumentStyles.page}>

      <div style={instrumentStyles.hdr}>
        <span style={instrumentStyles.hdrBig}>完成</span>
        <span style={instrumentStyles.doneTag}><Icon name="check" size={16} />已打卡</span>
      </div>

      <div style={instrumentStyles.gaugeWrap}>
        <span style={instrumentStyles.gaugeTag}>完成距离</span>
        <span style={instrumentStyles.gaugeTagRight}>{RUN.date}</span>
        <Gauge d={200} value={RUN.finishDist} unit="km" progress={0.895} />
      </div>

      <div style={instrumentStyles.dataRow}>
        <DataCell icon="clock" label="用时" value={RUN.finishTime} />
        <DataCell icon="pace" label="配速" value={RUN.finishPace} />
        <DataCell icon="flame" label="消耗 kcal" value={RUN.kcal} />
      </div>

      <div style={{ ...instrumentStyles.window, padding: '7px 12px 8px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <span style={instrumentStyles.label}><IconLabel name="route" size={16}>轨迹</IconLabel></span>
          <span style={instrumentStyles.label}>{RUN.points} 点</span>
        </div>
        <StreetMap h={56} lw={3} />
      </div>

      <div style={instrumentStyles.btnRow}>
        <button data-act="finish-data" onClick={() => open('finishData')} style={instrumentStyles.btnPrimary}>
          <Icon name="list" size={16} />查看完成数据
        </button>
        <button data-act="restart" onClick={restart} style={instrumentStyles.btnGhost}>
          <Icon name="reset" size={16} />再跑一次
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   屏幕：记录
   ============================================================ */

function HistoryScreen({ open }) {
  const calHead = ['一', '二', '三', '四', '五', '六', '日'];
  const calDays = [];
  for (let i = 0; i < 6; i++) calDays.push({ blank: true });
  for (let d = 1; d <= 30; d++) {
    let s = '';
    if (d >= 19 && d <= 23) s = 'done';
    if (d === 24) s = 'today';
    calDays.push({ d: String(d), s });
  }

  return (
    <div style={instrumentStyles.page}>

      <div style={instrumentStyles.hdr}>
        <span style={instrumentStyles.hdrBig}>记录</span>
        <span style={instrumentStyles.hdrSmall}>11月</span>
      </div>

      <div style={instrumentStyles.window}>
        <div style={instrumentStyles.windowTop}>
          <span style={instrumentStyles.label}><IconLabel name="distance" size={16}>本月里程</IconLabel></span>
          <span style={instrumentStyles.label}>打卡次数</span>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={instrumentStyles.num24}>{RUN.monthKm}<span style={instrumentStyles.unit16}> km</span></div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={instrumentStyles.num24}>{RUN.monthCount}<span style={instrumentStyles.unit16}> 次</span></div>
          </div>
        </div>
      </div>

      <div style={instrumentStyles.window}>
        <div style={instrumentStyles.windowTop}>
          <span style={instrumentStyles.label}><IconLabel name="calendar" size={16}>11月月历</IconLabel></span>
          <span style={instrumentStyles.label}>19 至 23 完成</span>
        </div>
        <div style={instrumentStyles.calHead}>
          {calHead.map(h => <div key={h} style={instrumentStyles.calHeadCell}>{h}</div>)}
        </div>
        <div style={instrumentStyles.calGrid}>
          {calDays.map((c, i) => (
            <div key={i} style={{
              ...instrumentStyles.calCell,
              ...(c.blank ? instrumentStyles.calBlank : {}),
              ...(c.s === 'done' ? instrumentStyles.calDone : {}),
              ...(c.s === 'today' ? instrumentStyles.calToday : {}),
            }}>{c.d || ''}</div>
          ))}
        </div>
      </div>

      <div style={instrumentStyles.label}><IconLabel name="list" size={16}>历史读数</IconLabel></div>

      {[RUN.rec1, RUN.rec2].map((r, i) => (
        <div key={i} data-act={'rec' + i} onClick={() => open('rec' + i)} style={instrumentStyles.recRow}>
          <div style={instrumentStyles.recLeft}>
            <span style={{ fontSize: 14, fontWeight: 500, color: 'var(--gray-12)' }}>{r.date}</span>
            <span style={instrumentStyles.label}>{r.time}　{r.pace}</span>
          </div>
          <div style={instrumentStyles.recRight}>
            <span style={instrumentStyles.recDist}>{r.dist}</span>
            <Icon name="chevron" size={16} />
          </div>
        </div>
      ))}

    </div>
  );
}

/* ============================================================
   弹层内容分发
   ============================================================ */

function ModalBody({ kind, onClose }) {
  if (kind === 'finishData') {
    return (
      <InstModal title="完成数据" onClose={onClose}>
        <div style={{ ...instrumentStyles.windowSoft, padding: '8px 10px 9px' }}>
          <div style={instrumentStyles.label}>完成距离</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 6 }}>
            <span style={instrumentStyles.modalBig}>{RUN.finishDist}</span>
            <span style={instrumentStyles.unit16}>km</span>
          </div>
        </div>

        <div style={{ marginTop: 10 }}>
          {[
            { icon: 'clock', k: '用时', v: RUN.finishTime },
            { icon: 'pace', k: '平均配速', v: RUN.finishPace },
            { icon: 'flame', k: '消耗', v: RUN.kcal + ' kcal' },
            { icon: 'route', k: '轨迹点', v: RUN.points + ' 点' },
          ].map(r => (
            <div key={r.k} style={instrumentStyles.modalRow}>
              <span style={instrumentStyles.label}><IconLabel name={r.icon} size={16}>{r.k}</IconLabel></span>
              <span style={instrumentStyles.num24}>{r.v}</span>
            </div>
          ))}
        </div>

        <div style={{ ...instrumentStyles.window, padding: '7px 10px 8px', marginTop: 9 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
            <span style={instrumentStyles.label}><IconLabel name="route" size={16}>轨迹</IconLabel></span>
            <span style={instrumentStyles.label}>{RUN.points} 点</span>
          </div>
          <StreetMap h={44} lw={4} />
        </div>

        <div style={{ ...instrumentStyles.window, padding: '7px 10px 9px', marginTop: 8 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 2 }}>
            <span style={instrumentStyles.label}>5 段分段配速</span>
            <span style={instrumentStyles.label}>每公里</span>
          </div>
          <SegmentBars h={16} />
        </div>

        <button onClick={onClose} style={{ ...instrumentStyles.btnPrimary, marginTop: 9, width: '100%' }}>
          <Icon name="share" size={16} />保存记录图
        </button>

    );
  }

  if (kind === 'rec0' || kind === 'rec1') {
    const r = kind === 'rec0' ? RUN.rec1 : RUN.rec2;
    return (
      <InstModal title="单次记录" onClose={onClose}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 14, fontWeight: 500, color: 'var(--gray-12)' }}>{r.date}</span>
          <span style={instrumentStyles.label}>距离</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 6 }}>
          <span style={instrumentStyles.modalBig}>{r.dist}</span>
          <span style={instrumentStyles.unit16}>km</span>
        </div>

        <div style={{ ...instrumentStyles.window, padding: '8px 10px 10px', marginTop: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={instrumentStyles.label}><IconLabel name="route" size={16}>轨迹</IconLabel></span>
            <span style={instrumentStyles.label}>{r.points} 点</span>
          </div>
          <StreetMap h={104} lw={4} />
        </div>

        <div style={{ marginTop: 8 }}>
          {[
            { icon: 'clock', k: '用时', v: r.time },
            { icon: 'pace', k: '平均配速', v: r.pace },
            { icon: 'route', k: '轨迹点', v: r.points + ' 点' },
          ].map(x => (
            <div key={x.k} style={instrumentStyles.modalRow}>
              <span style={instrumentStyles.label}><IconLabel name={x.icon} size={16}>{x.k}</IconLabel></span>
              <span style={instrumentStyles.num24}>{x.v}</span>
            </div>
          ))}
        </div>

        <button onClick={onClose} style={{ ...instrumentStyles.btnPrimary, marginTop: 12, width: '100%' }}>
          <Icon name="share" size={16} />生成记录图
        </button>
      </InstModal>
    );
  }
  return null;
}

/* ============================================================
   AppPhone：独立状态机，三台分别落在今日 / 跑中结果 / 记录
   ============================================================ */

function AppPhone({ initial, initialRun, Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [runState, setRunState] = React.useState(initialRun);
  const [paused, setPaused] = React.useState(false);
  const [modal, setModal] = React.useState(null);

  const go = s => { setScreen(s); setModal(null); };
  const start = () => { setRunState('live'); setPaused(false); setScreen('running'); setModal(null); };
  const end = () => { setRunState('result'); setPaused(false); };
  const restart = () => { setRunState('live'); setPaused(false); };
  const open = m => setModal(m);

  const screenEl = (() => {
    if (screen === 'today') return <TodayScreen start={start} />;
    if (screen === 'running') {
      return (
        <RunningScreen
          runState={runState}
          start={start}
          paused={paused}
          setPaused={setPaused}
          end={end}
          restart={restart}
          open={open}
        />
      );
    }
    if (screen === 'history') return <HistoryScreen open={open} />;
    return null;
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={660} time="19:30" battery={82} darkMode={false}>
          <div style={instrumentStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={go} />
            {modal && <ModalBody kind={modal} onClose={() => setModal(null)} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...instrumentStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={instrumentStyles.boardNum}>{num}</span>
        <span style={instrumentStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}

function ZoomDetail() {
  const lines = [
    { x1: 78, y1: 38, x2: 92, y2: 104, tx: 30, ty: 30, text: '5.37 km', anchor: 'start' },
    { x1: 362, y1: 38, x2: 350, y2: 104, tx: 412, ty: 30, text: '27:35', anchor: 'end' },
    { x1: 78, y1: 448, x2: 90, y2: 372, tx: 30, ty: 458, text: `5'08"`, anchor: 'start' },
    { x1: 332, y1: 448, x2: 352, y2: 372, tx: 412, ty: 458, text: '349 kcal', anchor: 'end' },
  ];
  return (
    <div style={{ ...instrumentStyles.zoomBox, left: 1120, top: 236, zIndex: 6 }}>
      <span style={instrumentStyles.zoomCap}>×2</span>
      <div style={{ position: 'absolute', left: 20, top: 40 }}>
        <Gauge d={400} value={RUN.finishDist} unit="km" progress={0.895} valueSize={56} />
      </div>
      <svg width="440" height="460" viewBox="0 0 440 460" style={instrumentStyles.zoomCallout}>
        {lines.map((l, i) => (
          <g key={i}>
            <line x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2}
              stroke="var(--gray-8)" strokeWidth="0.5" />
            <circle cx={l.x2} cy={l.y2} r="2.5" fill="var(--orange-9)" />
            <text x={l.tx} y={l.ty} textAnchor={l.anchor} fontSize="12"
              fontFamily={MONO} fill="var(--gray-12)" style={{ fontVariantNumeric: 'tabular-nums' }}>
              {l.text}
            </text>
          </g>
        ))}
      </svg>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
