            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),

function GlassSpots({ scale = 1 }) {
  const spot = (size, left, top, color, alpha) => ({
    position: 'absolute', width: size * scale, height: size * scale,
    left, top, borderRadius: '50%', pointerEvents: 'none',
    background: `radial-gradient(circle, color-mix(in srgb, ${color} ${alpha}%, transparent) 0%, color-mix(in srgb, ${color} ${Math.round(alpha * 0.35)}%, transparent) 45%, transparent 72%)`,
  });
  return (
    <React.Fragment>
      <div style={spot(360, -150, -110, 'var(--orange-9)', 58)} />
      <div style={spot(320, 168, 300, 'var(--teal-9)', 44)} />
      <div style={spot(300, -120, 440, 'var(--amber-9)', 50)} />
    </React.Fragment>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, initialPhase = 'ready', Frame, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [phase, setPhase] = React.useState(initialPhase);
  const [sheet, setSheet] = React.useState(null);
  const [paused, setPaused] = React.useState(false);

  const goTab = (key) => {
    setSheet(null);
    if (key === 'running') {
      setScreen('running');
      setPhase('ready');
      setPaused(false);
    } else {
      setScreen(key);
    }
  };
  const startRun = () => { setScreen('running'); setPhase('live'); setPaused(false); };
  const finish = () => { setPhase('result'); };
  const rerun = () => { setPhase('live'); setPaused(false); };
  const openSheet = (k) => setSheet(k);

  let screenEl;
  if (screen === 'today') {
    screenEl = <TodayScreen startRun={startRun} />;
  } else if (screen === 'history') {
    screenEl = <HistoryScreen openSheet={openSheet} />;
  } else {
    if (phase === 'ready') screenEl = <RunningReady startRun={startRun} />;
    else if (phase === 'live') screenEl = <RunningLive paused={paused} setPaused={setPaused} finish={finish} />;
    else screenEl = <RunningResult openSheet={openSheet} rerun={rerun} />;
  }

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{ position: 'absolute', left, top, zIndex: z }}>
        <FrameCmp width={330} height={760} time="19:30" battery={82} darkMode={false}>
          <div style={liquidStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={goTab} />
            {sheet && <SheetBody kind={sheet} onClose={() => setSheet(null)} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...liquidStyles.phoneLabel, left, top: labelTop, zIndex: z }}>
        <span style={liquidStyles.phoneNum}>{num}</span>
        <span style={liquidStyles.phoneTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}
