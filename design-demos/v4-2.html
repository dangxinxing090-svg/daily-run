            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),

function RingGauge({ value, unit, caption, valueSize = 76, size = 218 }) {
  const segColors = [
    'var(--orange-7)', 'var(--orange-9)', 'var(--orange-10)',
    'var(--orange-8)', 'var(--orange-11)',
  ];
  const R = 106;
  const C = 2 * Math.PI * R;
  const seg = C / 5;
  const ticks = Array.from({ length: 60 }, (_, i) => i);
  return (
    <div style={{ position: 'relative', width: size, height: size, margin: '0 auto', flex: '0 0 auto' }}>
      <svg viewBox="0 0 240 240" style={{ width: '100%', height: '100%', display: 'block' }}>
        <circle cx="120" cy="120" r={R} fill="none" stroke="var(--slate-3)" strokeWidth="9" />
        {segColors.map((c, i) => (
          <circle key={i} cx="120" cy="120" r={R} fill="none" stroke={c} strokeWidth="9"
            strokeDasharray={`${seg - 5} ${C - seg + 5}`} strokeDashoffset={-i * seg}
            transform="rotate(-90 120 120)" />
        ))}
        {ticks.map(i => {
          const a = (i * 6 - 90) * Math.PI / 180;
          const long = i % 5 === 0;
          const r1 = long ? 79 : 84;
          const r2 = 93;
          return (
            <line key={i}
              x1={120 + r1 * Math.cos(a)} y1={120 + r1 * Math.sin(a)}
              x2={120 + r2 * Math.cos(a)} y2={120 + r2 * Math.sin(a)}
              stroke="var(--orange-9)" strokeWidth={long ? 1.2 : 0.5}
              opacity={long ? 0.9 : 0.45} />
          );
        })}
        <circle cx="120" cy="120" r="78" fill="var(--slate-1)" stroke="var(--orange-9)" strokeWidth="0.5" />
        <circle cx="120" cy="120" r="72" fill="none" stroke="var(--slate-5)" strokeWidth="0.5" />
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{ ...instrumentStyles.num76, fontSize: valueSize, color: 'var(--slate-12)' }}>{value}</div>
        {unit && (
          <div style={{ fontSize: 16, fontWeight: 600, color: 'var(--orange-11)', marginTop: 2 }}>
            {unit}
          </div>
        )}
        <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--slate-11)', marginTop: 4 }}>{caption}</div>
      </div>
    </div>
  );
}

function RunningScreen({ runState, setRunState, paused, setPaused, open }) {
  if (runState === 'idle') return <RunningIdle setRunState={setRunState} />;
  if (runState === 'live') return <RunningLive setRunState={setRunState} paused={paused} setPaused={setPaused} />;
  return <RunningResult setRunState={setRunState} open={open} />;
}

/* ============================================================
   记录
   ============================================================ */

function CalendarGrid() {
  const head = ['一', '二', '三', '四', '五', '六', '日'];
  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(i);
  const done = new Set([18, 19, 20, 21, 22]);
  return (
    <div style={instrumentStyles.calGrid}>
      {head.map(h => <div key={h} style={instrumentStyles.calHead}>{h}</div>)}
      {cells.map(i => {
        let label = '';
        let cls = {};
        if (i >= 5 && i <= 35) {
          const day = i - 4;
          label = String(day);
          if (done.has(i)) cls = instrumentStyles.calDone;
          if (day === 24) cls = instrumentStyles.calToday;
        }
        return <div key={i} style={{ ...instrumentStyles.calCell, ...cls }}>{label}</div>;
      })}
    </div>
  );
}

/* ============================================================
   AppPhone：每台独立状态机
   ============================================================ */

function AppPhone({ initial, initialRun = 'idle', Frame, scale, left, top, z, num, label, labelTop }) {
  const [screen, setScreen] = React.useState(initial);
  const [runState, setRunState] = React.useState(initialRun);
  const [modal, setModal] = React.useState(null);
  const [paused, setPaused] = React.useState(false);

  const go = (s, rs) => { setScreen(s); if (rs) setRunState(rs); setModal(null); };
  const open = (m) => setModal(m);

  const screenEl = (() => {
    switch (screen) {
      case 'today':   return <TodayScreen go={go} />;
      case 'running': return <RunningScreen runState={runState} setRunState={setRunState}
        paused={paused} setPaused={setPaused} open={open} />;
      case 'history': return <RecordScreen open={open} />;
      default:        return null;
    }
  })();

  const FrameCmp = Frame === 'android' ? AndroidFrame : IosFrame;

  return (
    <React.Fragment>
      <div data-phone={num} style={{
        position: 'absolute', left, top, zIndex: z,
        transform: 'scale(' + scale + ')', transformOrigin: 'top left',
      }}>
        <FrameCmp width={320} height={680} time="19:30" battery={82} darkMode={false}>
          <div style={instrumentStyles.screenRoot}>
            {screenEl}
            <TabBar current={screen} onTab={(k) => go(k)} />
            {modal && <SheetBody kind={modal} onClose={() => setModal(null)} />}
          </div>
        </FrameCmp>
      </div>
      <div style={{ ...instrumentStyles.boardLabel, left, top: labelTop, zIndex: z }}>
        <span style={instrumentStyles.boardNum}>{num}</span>
        <span style={instrumentStyles.boardTxt}>{label}</span>
      </div>
    </React.Fragment>
  );
}
