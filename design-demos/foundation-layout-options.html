    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid #1465b6;
      outline-offset: 3px;
    }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    .board { max-width: 1420px; margin: auto; padding: 48px 44px 54px; }
    .board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .product { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 650; }
    .product-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #0d74ce; color: white; }
    .runner { display: inline-block; background: currentColor; mask: var(--runner-mask) center / contain no-repeat; width: 1em; height: 1em; flex: none; }
    .product-mark .runner { font-size: 20px; }
    h1 { font-size: clamp(1.9rem, 3.6vw, 3.2rem); line-height: 1.16; font-weight: 680; letter-spacing: -.075em; margin: 13px 0 0; }
    .board-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .switcher { display: inline-flex; align-items: center; padding: 4px; background: #dfe2de; border: 1px solid #d7dad5; border-radius: 13px; }
    .switcher button, .size-button, .review-link {
      border: 0; background: transparent; min-height: 39px; padding: 0 15px;
      border-radius: 9px; font-size: .8125rem; font-weight: 570; white-space: nowrap;
    }
    .switcher button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px #142b1d1c; }
    .size-button { min-height: 49px; border: 1px solid #cdd1cb; }
    .review-link { display: inline-flex; align-items: center; min-height: 49px; border: 1px solid #cdd1cb; color: inherit; text-decoration: none; }
    .review-link:focus-visible { outline: 2px solid #1465b6; outline-offset: 3px; }
    .size-button[aria-pressed="true"] { background: #f8f9f7; }
    .intro { margin: 13px 0 26px; color: #535952; font-size: .875rem; line-height: 1.55; }
    .options { border-top: 1px solid #cfd3ce; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; padding-top: 23px; }

    }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .start-stage { flex: 1; min-height: 196px; display: grid; place-items: center; position: relative; }

    .calm .start-stage::before, .calm .start-stage::after, .journal .start-stage::before {

    .calm .start-button { background: linear-gradient(145deg, #0a6dca, #0d74ce 68%, #125eab); }
    .track .start-stage {

    }

      content: ""; width: 270px; height: 126px; position: absolute; border: 1px solid #b8d0ef;

    .journal .navigation {
      margin: 0 var(--pad) 12px; padding: 2px 4px;

    }

    .nav-active { position: absolute; top: 8px; right: calc(50% - 19px); width: 6px; height: 6px; border-radius: 50%; background: var(--result); }
    .journal .nav-active { right: 9px; top: 7px; }
    .home-safe { height: 13px; flex: none; display: grid; place-items: start center; }

    .run-header-label, .status { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .status { color: var(--result); font-size: var(--caption); font-weight: 650; line-height: 1.3; }

    .status[data-paused="true"] { color: var(--muted); }
    .headline { font-size: var(--display); line-height: .97; font-weight: 730; margin-top: 4px; overflow-wrap: anywhere; }
    .headline small { font-size: .28em; margin-inline-start: .35em; }
    .head-metric { display: grid; gap: 7px; }
    .track .head-metric { padding: 10px 0 6px; }
    .track .headline { color: var(--action); }
    .journal .headline { font-weight: 610; }
    .map { min-height: 125px; position: relative; overflow: hidden; background: var(--map-bg); border-radius: var(--radius); border: 1px solid var(--line); }
    .run-map { flex: 1; min-height: 150px; }
    .track .run-map { min-height: 121px; }
    .journal .run-map { border-radius: var(--radius) var(--radius) 5px 5px; }
    .map canvas { width: 100%; height: 100%; position: absolute; inset: 0; }
    .map-caption {
      position: absolute; margin: 0; z-index: 1; bottom: 8px; left: 8px; border-radius: 6px;
      padding: 4px 7px; background: var(--surface); color: var(--muted); font-size: .75rem;
    }
    .pace-chart { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 12px; }
    .pace-bars { display: flex; align-items: flex-end; gap: 4px; height: 28px; }

    .run-controls {
      flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap);
      padding: 0 var(--pad) 12px;
    }
    .track .run-controls { background: var(--surface); border-top: 1px solid var(--line); padding-top: 12px; grid-template-columns: 3fr 2fr; }
    .journal .run-controls { padding-bottom: 10px; }
    .action-button, .secondary-button, .end-button, .quiet-button {
      min-height: 48px; padding: 7px 8px; border: 1px solid transparent; border-radius: min(var(--radius), 16px);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: .9375rem; line-height: 1.2; font-weight: 650;
    }
    .action-button { color: #fff; background: var(--action); }
    .secondary-button { background: var(--surface); border-color: var(--line); color: var(--text); }
    .end-button { color: var(--danger); background: var(--danger-soft); }
    .quiet-button { border: 0; background: transparent; color: var(--action); padding-inline: 5px; }
    .tracking-link { margin-top: auto; width: 100%; }

    .records h4, .calendar h4 { margin: 0; font-size: .9375rem; font-weight: 660; }
    .calendar { padding: 12px 13px 10px; }

    .day-grid .run-day { color: var(--result); font-weight: 710; }
    .day-grid .run-day::after { content: ""; position: absolute; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
    .day-grid .today-date { border: 1px solid var(--action); border-radius: 8px; }
    .records { display: grid; gap: 7px; }

      display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 8px;
      min-height: 55px; width: 100%; align-items: center; padding: 6px 8px; text-align: start;
    }
    .record-route { display: grid; place-items: center; width: 40px; height: 38px; color: var(--track); border-radius: 8px; background: var(--map-bg); }

    .track .history-content .record-row { border-inline-start: 3px solid #b4cbe7; }
    .journal .history-content .stats { padding-block: 12px 13px; border: 0; border-block: 1px solid var(--line); background: transparent; border-radius: 0; }
    .journal .history-content .stats .metric-value { font-size: 1.45rem; }
    .journal .calendar { padding: 2px 0; background: transparent; border-width: 0 0 1px; border-radius: 0; }
    .journal .record-row { grid-template-columns: 42px minmax(0,1fr) auto; border-radius: 0; background: transparent; border-width: 0 0 1px; padding-inline: 0; }
    .journal .record-route { position: relative; background: transparent; }

    .sheet {

    .share-card {
      width: min(100%, 236px); aspect-ratio: 3 / 4; justify-self: center; display: grid;
      grid-template-rows: auto minmax(110px,1fr) auto; gap: 10px; padding: 10px;

    .board[data-view="review"] { max-width: 980px; }

    .refined .today-content .screen-header { align-items: baseline; }

    .refined .start-button, .button-options .start-button {

        return `<div class="screen-scroll" data-scroll><div class="content result-content">
          <header class="screen-header"><h3>跑步完成</h3><span class="status">已保存</span></header>
          <div class="head-metric"><div class="headline number">${finished.km}<small>km</small></div><span class="label">距离</span></div>
          ${map()}${stats([stat('用时',finished.elapsed),stat('平均配速',finished.pace,'/km'),stat('估算消耗',finished.energy,'kcal')], true)}
          ${btn('share', '预览记录图', 'action-button', 'share')}
        </div></div>`;
      }
      if (option.refined) return refinedRunPanel(s);
      const paused = s.run === 'paused';
      const focus = option.key === 'track';
      const secondary = focus ? stat('用时',example.elapsed) : stat('距离',example.km,'km');
      const cells = [secondary,stat('配速',example.pace,'/km'),stat('速度',example.speed,'km/h'),stat('估算消耗',example.energy,'kcal')];
      return `<div class="screen-scroll" data-scroll><div class="content run-content">
        <header class="screen-header"><span class="status" data-paused="${paused}" role="status">${paused ? '已暂停' : '正在记录'}</span>
          ${focus ? btn('collapse', '收起', 'quiet-button') : '<span class="meta">11 月 27 日</span>'}
        </header>
        <div class="head-metric"><div class="headline number">${focus ? `${example.km}<small>km</small>` : example.elapsed}</div>
          <span class="label">${focus ? '已跑距离' : '已用时间'}</span>
        </div>
        ${focus ? stats(cells) : ''}
        ${map('跑步轨迹','run-map')}
        <div class="pace-chart"><span class="label">配速曲线 <span class="number">/ 500 m</span></span>
          <div class="pace-bars" role="img" aria-label="最近八段配速变化">${[43,62,53,68,82,62,74,68].map(v => `<span style="height:${v}%"></span>`).join('')}</div>
        </div>
        ${focus ? '' : stats(cells)}
      </div></div>${runControls(paused, focus)}`;
    }
    function calendar(s) {
      const days = new Set([2,5,8,12,16,20,22,25]);
      if (s.added) days.add(27);
      const labels = ['一','二','三','四','五','六','日'];
      return `<section class="calendar card" aria-label="11 月跑步月历">
        <div class="calendar-head"><h4>11 月月历</h4><span class="label">圆点标记跑步日</span></div>
        <div class="day-grid">
          ${labels.map(label => `<span class="weekday">${label}</span>`).join('')}
          ${'<span aria-hidden="true"></span>'.repeat(6)}
          ${Array.from({length:30}, (_,i) => i + 1).map(day =>
            `<span class="${days.has(day) ? 'run-day' : ''} ${day === 27 ? 'today-date' : ''}" ${day === 27 ? 'aria-current="date"' : ''}>${day}${days.has(day) ? '<span class="sr-only">，跑步日</span>' : ''}</span>`
          ).join('')}
        </div>
      </section>`;
    }
    function recordItems(s) { return s.added ? [finished,...sessions] : sessions; }
    function historyPanel(s, option) {
      const records = `<section class="records"><h4>${option.key === 'track' ? '最近跑步' : '历史记录'}</h4>
        ${recordItems(s).map((run,i) => `<button class="record-row card" data-action="record-${i}">
          <span class="record-route">${icon('route')}</span>
          <span class="record-date">${run.date}<small class="label number">${run.elapsed} / ${run.pace}</small></span>
          <span class="record-distance number">${run.km} <small>km</small></span>
        </button>`).join('')}
      </section>`;
      return `<div class="screen-scroll" data-scroll><div class="content history-content">
        <header class="screen-header"><h3>记录</h3>${btn('backup', '备份', 'quiet-button')}</header>
        ${stats([stat('本月里程',s.added ? '47.8' : '42.6','km'),stat('跑步天数',s.added ? '9' : '8','天')],true)}
        ${option.key === 'track' ? records + calendar(s) : calendar(s) + records}
      </div></div>`;
    }

    function navigation(s) {
      return `<nav class="navigation" aria-label="App 主导航">${Object.entries(pageLabels).map(([page,[label,mark]]) => `
        <button data-action="nav-${page}" ${s.page === page ? 'aria-current="page"' : ''} ${page === 'running' && (s.run === 'live' || s.run === 'paused') ? `aria-label="跑中，${s.run === 'live' ? '正在记录' : '已暂停'}"` : ''}>
          ${icon(mark)}<span>${label}</span>
          ${page === 'running' && (s.run === 'live' || s.run === 'paused') ? '<span class="nav-active" aria-hidden="true"></span>' : ''}
        </button>`).join('')}</nav>`;
    }

    function modal(s, option) {
      if (!s.dialog) return '';
      let label, contents;
      if (s.dialog === 'target') {
        label = '编辑今日目标';
        contents = `<form class="sheet-panel" data-target-form>
          <h4 id="dialog-${option.key}">${label}</h4>
          <label>距离（km）<input class="sheet-field" name="target" type="number" min=".1" max="100" step=".01" required value="${s.target.toFixed(2)}"></label>
          <div class="sheet-actions">${btn('close', '取消', 'secondary-button')}<button type="submit" class="action-button">完成</button></div>
        </form>`;
      } else {
        if (s.dialog === 'share') {
          label = '记录图预览';
          contents = `<div class="share-card"><p class="label">每日跑步 <span class="number">/ 11 月 27 日</span></p>${map()}${stats([stat('距离',finished.km,'km'),stat('用时',finished.elapsed),stat('配速',finished.pace,'/km')],true)}</div>${btn('close','关闭','secondary-button')}`;
        } else if (s.dialog === 'backup') {
          label = '备份与恢复';
          contents = `<p class="label">正式 App 使用系统文件选择器保存或读取备份。</p>${btn('close','关闭','secondary-button')}`;
        } else {
          const run = recordItems(s)[Number(s.dialog.split('-')[1])];
          label = run.date + ' 跑步';
          contents = `${map()} ${stats([stat('距离',run.km,'km'),stat('用时',run.elapsed),stat('配速',run.pace,'/km')],true)}${btn('close','关闭','secondary-button')}`;
        }
        contents = `<div class="sheet-panel"><h4 id="dialog-${option.key}">${label}</h4>${contents}</div>`;
      }
      return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-${option.key}">${contents}</div>`;
    }

    function colorValue(element, key) {
      return getComputedStyle(element).getPropertyValue(key).trim();
    }

    function setup() {
      if (review) {
        board.dataset.view = 'review';
        const title = runReview ? '跑中页精修' : '今日页精修';
        document.title = '每日跑步 · ' + title;
        board.querySelector('h1').textContent = title;
        board.querySelector('.intro').textContent = runReview
          ? '用右侧示例检查读数、定位和暂停状态，左侧是 v0.1。'
          : '切换今日页状态，并排比较三款开跑按钮。';
        board.querySelector('.switcher').innerHTML = runReview ? `
          <button data-scenario="live" aria-pressed="true">记录中</button>
          <button data-scenario="paused" aria-pressed="false">已暂停</button>
          <button data-scenario="acquiring" aria-pressed="false">定位中</button>
          <button data-scenario="weak" aria-pressed="false">信号弱</button>
          <button data-scenario="long-run" aria-pressed="false">长计时</button>` : `
          <button data-scenario="empty" aria-pressed="true">未开跑</button>
          <button data-scenario="reached" aria-pressed="false">已达目标</button>
          <button data-scenario="long" aria-pressed="false">长数字</button>`;
        board.querySelector('.switcher').setAttribute('aria-label', '切换' + title + '示例');
        const link = board.querySelector(`[data-review-link="${reviewPage}"]`);
        link.href = 'foundation-layout-options.html';
        link.textContent = '返回三案';
        board.querySelector('.board-foot p').textContent = '按「320 窄屏」检查排版。开跑和定位授权均使用模拟状态。';
        const examples = board.querySelector('.button-options');
        examples.hidden = runReview;
        examples.querySelector('.button-examples').innerHTML = buttonDesigns.map(design => `
          <article class="button-example" data-button-design="${design.key}">
            <div class="start-stage">
              <button class="start-button" data-choose-button="${design.key}" aria-label="应用${design.name}" aria-pressed="false">
                <span class="runner" aria-hidden="true"></span>
              </button>
            </div>
            <h3>${design.name}</h3><p>${design.description}</p>
          </article>`).join('');
      }
      document.querySelector('#options').innerHTML = options.map(option => `
        <article class="option ${option.theme || option.key}${option.refined ? ' refined' : ''}" data-key="${option.key}" ${option.refined ? 'data-button-design="gradient"' : ''} aria-labelledby="option-${option.key}">
          <div class="option-head">
            <div class="option-title"><span class="option-id">${option.id}</span><h2 id="option-${option.key}">${option.name}</h2></div>
            <p>${option.pitch}</p>
          </div>
          <div class="device"></div>
          <details class="tokens">
            <summary>设计变量与布局</summary>
            <dl>
              <dt>配色</dt><dd class="colors"></dd>
              <dt>字阶</dt><dd>${option.type}（辅助 / 正文 / 标题 / 跑中数字）</dd>
              <dt>尺寸</dt><dd>${option.spacing}</dd>
              <dt>边界</dt><dd>1 边框，48 最小操作区，数字等宽。</dd>
              <dt>导航</dt><dd>${option.nav}</dd>
              <dt>布局</dt><dd>${option.layout}</dd>
            </dl>
            <p>${option.choice}</p>
          </details>
        </article>`).join('');
      if (review && !runReview) selectButtonDesign('gradient');
      for (const option of options) {
        const el = document.querySelector(`[data-key="${option.key}"]`);
        const theme = Object.fromEntries(
          ['bg','surface','text','muted','action','action-text','track','result','line','map-bg','map-green','map-line','map-water']
            .map(key => [key,colorValue(el,'--' + key)]));
        values.set(option.key,theme);
        const swatches = [['底色',theme.bg],['组件底',theme.surface],['主操作与轨迹',theme.action],['成绩',theme.result],['正文',theme.text],['辅助文字',theme.muted],['边框',theme.line]];
        if (theme['action-text']) swatches.push(['选中文字',theme['action-text']]);
        const flat = swatches.map(([role,color]) => `${role} ${color.toUpperCase()}`).join(' / ');
        el.querySelector('.colors').innerHTML = `<div class="palette" aria-hidden="true">${swatches.map(([_,color]) => `<span style="background:${color}"></span>`).join('')}</div>${flat}`;
        render(option);
      }
    }

    function selectButtonDesign(key) {
      board.querySelector('.option.refined').dataset.buttonDesign = key;
      for (const button of board.querySelectorAll('[data-choose-button]')) {
        const selected = key === button.dataset.chooseButton;
        button.setAttribute('aria-pressed', selected);
        button.closest('.button-example').dataset.selected = selected;
      }
      const design = buttonDesigns.find(item => item.key === key);
      board.querySelector('.selection-note').textContent = `${design.name}已应用。点右侧今日页的跑者可试开跑。`;
    }

    const route = [[.17,.72],[.22,.64],[.25,.58],[.30,.55],[.34,.54],[.37,.48],[.40,.42],[.41,.33],[.45,.28],[.50,.28],[.55,.32],[.58,.35],[.62,.32],[.64,.24],[.69,.20],[.75,.23],[.77,.31],[.74,.38],[.70,.43],[.67,.47],[.69,.55],[.74,.59],[.81,.57],[.85,.49]];
    const mapObservers = new WeakMap();
    function drawRoute(canvas, key) {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const {width:w,height:h} = rect;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const c = canvas.getContext('2d');
      c.scale(dpr, dpr);
      const t = values.get(key);

      c.fillStyle = t['map-bg'];
      c.fillRect(0,0,w,h);
      c.fillStyle = t['map-green'];
      if (key === 'track') {
        c.lineWidth = 1;
        c.strokeStyle = '#c8dcee';
        c.beginPath();
        for (let x = 12; x < w; x += 22) { c.moveTo(x,0); c.lineTo(x,h); }
        for (let y = 12; y < h; y += 22) { c.moveTo(0,y); c.lineTo(w,y); }
        c.stroke();
      } else {
        c.beginPath();
        c.moveTo(0,0);
        c.bezierCurveTo(w*.35,h*.10,w*.28,h*.48,w*.12,h*.52);
        c.lineTo(0,h*.61);
        c.closePath();
        c.fill();
        c.beginPath();
        c.ellipse(w*.86,h*.90,w*.29,h*.26,-.31,0,Math.PI*2);
        c.fill();
        c.beginPath();
        c.moveTo(w*.18,h*1.1);
        c.bezierCurveTo(w*.28,h*.82,w*.63,h*.72,w*1.05,h*.85);
        c.lineWidth = h*.19;
        c.strokeStyle = t['map-water'];
        c.stroke();
        c.strokeStyle = t['map-line'];
        c.lineWidth = key === 'journal' ? 1.35 : 2;
        c.beginPath();
        c.moveTo(0,h*.61);
        c.bezierCurveTo(w*.19,h*.69,w*.35,h*.54,w*.39,h*.35);
        c.bezierCurveTo(w*.51,h*.2,w*.68,h*.5,w,h*.09);
        c.moveTo(w*.18,0);
        c.bezierCurveTo(w*.27,h*.4,w*.24,h*.46,w*.40,h*.59);
        c.bezierCurveTo(w*.54,h*.74,w*.54,h*.82,w*.48,h);
        c.moveTo(w*.83,0);
        c.bezierCurveTo(w*.65,h*.33,w*.73,h*.8,w*.98,h);
        c.stroke();
      }

      if (canvas.dataset.route === 'false') return;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(route[0][0]*w,route[0][1]*h);
      for (let i = 1; i < route.length - 1; i++) {
        const [x,y] = route[i];
        c.quadraticCurveTo(x*w,y*h,(x+route[i+1][0])/2*w,(y+route[i+1][1])/2*h);
      }
      const end = route.at(-1);
      c.lineTo(end[0]*w,end[1]*h);
      c.lineWidth = key === 'track' ? 8 : 9;
      c.strokeStyle = '#fff';
      c.stroke();
      c.lineWidth = key === 'track' ? 4 : 5;
      c.strokeStyle = t.track;
      c.stroke();
      for (const [i,point] of [route[0],end].entries()) {
        c.beginPath();
        c.arc(point[0]*w,point[1]*h,4.4,0,Math.PI*2);
        c.fillStyle = i ? t.track : '#fff';
        c.fill();
        c.strokeStyle = i ? '#fff' : t.track;
        c.lineWidth = 1.8;
        c.stroke();
      }
    }

    function updateBoardSelection() {
      const pages = options.map(option => state.get(option.key).page);
      for (const control of document.querySelectorAll('[data-board-page]')) {
        control.setAttribute('aria-pressed',pages.every(page => page === control.dataset.boardPage));
      }
    }

    function render(option, focusSelector = '', transition = '') {
      const s = state.get(option.key);
      const device = document.querySelector(`[data-key="${option.key}"] .device`);
      const samePage = device.dataset.page === s.page;
      const previous = device.querySelector('.screen [data-scroll]');
      const scroll = samePage ? previous?.scrollTop : 0;
      device.dataset.page = s.page;
      for (const canvas of device.querySelectorAll('canvas')) mapObservers.get(canvas)?.disconnect();
      const active = s.page === 'running' && ['live','paused'].includes(s.run);
      const focusRun = option.key === 'track' && active;
      device.innerHTML = `<div class="screen ${active ? 'running-active' : ''}" ${s.dialog ? 'inert' : ''}>
        ${s.page === 'today' ? todayPanel(s,option) : s.page === 'running' ? runPanel(s,option) : historyPanel(s,option)}
        ${focusRun ? '' : navigation(s)}<div class="home-safe" aria-hidden="true"></div>
      </div>${modal(s,option)}`;
      if (scroll) device.querySelector('[data-scroll]').scrollTop = scroll;
      if (option.refined && !samePage && transition && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        animatePage(device, previous, transition);
      }
      for (const canvas of device.querySelectorAll('canvas')) {
        const refresh = () => drawRoute(canvas,option.key);
        const observer = new ResizeObserver(refresh);
        observer.observe(canvas);
        mapObservers.set(canvas,observer);
        refresh();
      }
      if (s.dialog) device.querySelector('.sheet input, .sheet button').focus({preventScroll:true});
      else if (focusSelector) device.querySelector(focusSelector)?.focus({preventScroll:true});
      updateBoardSelection();
    }

    function animatePage(device, previous, transition) {
      const incoming = device.querySelector('.screen [data-scroll]');
      if (transition !== 'start' || !previous) {
        incoming.animate([{ opacity: .45 }, { opacity: 1 }], { duration: 110, easing: 'ease-out' });
        return;
      }
      previous.inert = true;
      previous.setAttribute('aria-hidden', 'true');
      previous.classList.add('page-leaving');
      previous.style.height = `${incoming.clientHeight}px`;
      device.append(previous);
      const animation = previous.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: 'ease-out' });
      animation.onfinish = () => previous.remove();
    }

    function openPage(s, page) {
      s.page = page;
      s.dialog = null;
      s.authorization = null;
    }

    function beginRun(s, option) {
      s.run = 'live';
      s.sampleActive = false;
      s.location = 'ready';
      s.longRun = false;
      openPage(s,'running');
      render(option,'[data-action="pause"]','start');
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.chooseButton) {
        selectButtonDesign(button.dataset.chooseButton);
        return;
      }
      if (button.dataset.scenario) {
        const scenario = button.dataset.scenario;
        for (const control of board.querySelectorAll('[data-scenario]')) {
          control.setAttribute('aria-pressed', control === button);
        }
        for (const option of options) {
          const s = state.get(option.key);
          if (runReview) {
            s.run = scenario === 'paused' ? 'paused' : 'live';
            s.location = scenario === 'acquiring' || scenario === 'weak' ? scenario : 'ready';
            s.longRun = scenario === 'long-run';
            s.added = false;
          } else {
            Object.assign(s, { run: 'idle', target: 5, added: scenario === 'reached', longNumbers: scenario === 'long', authorized: false });
          }
          openPage(s,runReview ? 'running' : 'today');
          render(option);
        }
        return;
      }
      if (button.dataset.boardPage) {
        const page = button.dataset.boardPage;
        for (const option of options) {
          const s = state.get(option.key);
          openPage(s,page);
          if (page === 'running' && ['idle','result'].includes(s.run)) {
            s.run = 'live';
            s.sampleActive = true;
          } else if (page !== 'running' && s.sampleActive) {
            s.run = s.added ? 'result' : 'idle';
            s.sampleActive = false;
          }
          render(option);
        }
        return;
      }
      if (button.matches('.size-button')) {
        board.dataset.size = board.dataset.size === 'compact' ? 'regular' : 'compact';
        button.setAttribute('aria-pressed',board.dataset.size === 'compact');
        return;
      }
      const action = button.dataset.action;
      if (!action) return;
      const key = button.closest('[data-key]').dataset.key;
      const option = options.find(item => item.key === key);
      const s = state.get(key);
      let focus = '';
      let transition = '';
      if (action.startsWith('nav-')) {
        openPage(s,action.slice(4));
        focus = `[data-action="${action}"]`;
        transition = 'tab';
      } else if (action === 'start') {
        if (s.authorization) return;
        if (option.refined && s.page === 'today' && !s.authorized) {
          const request = {};
          s.authorization = request;
          render(option,'[data-action="start"]');
          setTimeout(() => {
            if (s.authorization !== request) return;
            s.authorized = true;
            beginRun(s,option);
          }, 1400);
          return;
        }
        beginRun(s,option);
        return;
      } else if (action === 'pause') {
        s.run = s.run === 'paused' ? 'live' : 'paused';
        focus = '[data-action="pause"]';
      } else if (action === 'finish') {
        s.run = 'result';
        s.added = true;
        s.sampleActive = false;
        s.dialog = null;
        focus = '[data-action="share"]';
      } else if (action === 'collapse' || action === 'open-running') {
        openPage(s,action === 'collapse' ? 'today' : 'running');
        focus = action === 'collapse' ? '[data-action="open-running"]' : '[data-action="pause"]';
        transition = 'tab';
      } else if (action === 'close') {
        event.preventDefault();
        s.dialog = null;
        focus = `[data-action="${s.returnAction}"]`;
      } else {
        s.authorization = null;
        s.dialog = action;
        s.returnAction = action;
      }
      render(option,focus,transition);
    });

    document.addEventListener('submit', event => {
      if (!event.target.matches('[data-target-form]')) return;
      event.preventDefault();
      const key = event.target.closest('[data-key]').dataset.key;
      const s = state.get(key);
      s.target = Number(new FormData(event.target).get('target'));
      s.dialog = null;
      render(options.find(option => option.key === key),'[data-action="target"]');
    });

    document.addEventListener('keydown', event => {
      const sheet = event.target.closest('.sheet');
      if (!sheet) return;
      const key = sheet.closest('[data-key]').dataset.key;
      const s = state.get(key);
      if (event.key === 'Escape') {
        s.dialog = null;
        render(options.find(option => option.key === key),`[data-action="${s.returnAction}"]`);
      }
      if (event.key === 'Tab') {
        const controls = [...sheet.querySelectorAll('input, button:not(:disabled)')];
        const first = controls[0];
        const last = controls.at(-1);
        if (event.shiftKey && event.target === first || !event.shiftKey && event.target === last) {
          event.preventDefault();
          (event.shiftKey ? last : first).focus();
        }
      }
    });

    setup();
  </script>
</body>
</html>
