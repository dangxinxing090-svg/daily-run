name: 构建安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: 检查并构建 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 接受安卓许可
        run: yes | flutter doctor --android-licenses || true

      - name: 取依赖
        run: flutter pub get

      - name: 静态分析与测试
        run: |
          dart analyze lib tool test
          flutter test
          dart run tool/verify.dart

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 归档安装包
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/daily-run-v0.1.0.apk

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-apk
          path: dist/*.apk
          if-no-files-found: error
