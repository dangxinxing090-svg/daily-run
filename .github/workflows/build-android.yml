name: 构建 Android 和 iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: 检查并构建 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 接受安卓许可
        run: yes | flutter doctor --android-licenses || true

      - name: 取依赖
        run: flutter pub get

      - name: 静态分析与测试
        run: |
          dart analyze lib tool test
          flutter test
          dart run tool/verify.dart

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 归档安装包
        run: |
          mkdir -p ../dist
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/daily-run-v${version%%+*}.apk"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: 构建 iOS App
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: 取依赖
        run: flutter pub get

      - name: 构建 iOS 模拟器 App
        run: |
          flutter build ios --simulator --debug
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app ../dist/daily-run-ios-simulator.app.zip

      - name: 上传 iOS 模拟器 App
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-ios-simulator
          path: dist/daily-run-ios-simulator.app.zip
          if-no-files-found: error

      - name: 构建 iOS 真机 App（未签名）
        run: |
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../dist/daily-run-ios-unsigned.app.zip

      - name: 上传 iOS 真机 App（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-ios-unsigned
          path: dist/daily-run-ios-unsigned.app.zip
          if-no-files-found: error
